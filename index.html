<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacaciones · Paz Mental</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1c1c2e;
            --ink-soft: #52526e;
            --ink-muted: #9898b8;
            --bg: #f0eff8;
            --white: #ffffff;
            --accent:       #6c5ce7;
            --accent-light: #ede9fd;
            --ok:           #00836e;
            --ok-light:     #d4f5ef;
            --warn:         #b86200;
            --warn-light:   #fdecd4;
            --danger-text:  #a61c1c;
            --danger-bg:    #fde8e8;
            --blue:         #1a6fb5;
            --blue-light:   #dceeff;
            --purple-light: #f0edff;
            --border: #e2e0f0;
            --stripe-a: #f7f6ff;
            --stripe-b: #f2faf8;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); font-size:13.5px; line-height:1.4; }

        /* HEADER */
        .site-header {
            background:var(--ink); color:#fff;
            padding:11px 28px;
            display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; z-index:200;
            box-shadow:0 2px 12px rgba(0,0,0,.3);
        }
        .site-header h1 { font-family:'DM Serif Display',serif; font-size:1.1rem; }
        .site-header small { color:rgba(255,255,255,.4); font-size:.7rem; margin-left:8px; }
        #lastUpdate { font-size:.7rem; color:rgba(255,255,255,.35); }

        /* SUMMARY */
        .summary-bar {
            background:var(--white); border-bottom:1px solid var(--border);
            padding:9px 28px; display:flex; gap:20px; flex-wrap:wrap; align-items:center;
        }
        .s-pill { display:flex; align-items:center; gap:6px; font-size:.78rem; }
        .s-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .s-pill strong { font-size:.95rem; font-weight:600; }

        /* CONTROLS */
        .controls { padding:10px 28px; display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
        .search-input {
            padding:6px 12px; border:1.5px solid var(--border); border-radius:7px;
            font-size:.8rem; font-family:'DM Sans',sans-serif;
            background:var(--white); color:var(--ink); width:200px;
        }
        .search-input:focus { outline:none; border-color:var(--accent); }
        .fbtn {
            padding:5px 12px; border:1.5px solid var(--border); border-radius:7px;
            font-size:.75rem; font-family:'DM Sans',sans-serif;
            background:var(--white); color:var(--ink-soft); cursor:pointer; transition:all .15s;
        }
        .fbtn.active,.fbtn:hover { background:var(--ink); color:#fff; border-color:var(--ink); }

        /* LIST */
        .emp-list { padding:10px 28px 60px; display:flex; flex-direction:column; gap:8px; }

        /* CARD */
        .emp-card {
            background:var(--white); border:1px solid var(--border);
            border-radius:9px; overflow:hidden;
            box-shadow:0 1px 5px rgba(28,28,46,.05);
        }
        .emp-card.has-expired { border-left:3px solid var(--danger-text); }
        .emp-card.has-soon    { border-left:3px solid var(--warn); }

        /* CARD HEADER */
        .ch {
            padding:10px 16px; display:flex; align-items:center; gap:11px;
            cursor:pointer; user-select:none; background:var(--white); transition:background .15s;
        }
        .ch:hover { background:#fafafe; }
        .avatar {
            width:32px; height:32px; border-radius:50%; background:var(--ink); color:#fff;
            display:flex; align-items:center; justify-content:center;
            font-family:'DM Serif Display',serif; font-size:.85rem; flex-shrink:0;
        }
        .ch-name { flex:1; min-width:0; }
        .ch-name strong { font-size:.9rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ch-name span   { font-size:.7rem; color:var(--ink-muted); }
        .ch-badges { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
        .bdg { padding:2px 8px; border-radius:10px; font-size:.7rem; font-weight:500; white-space:nowrap; }
        .bdg-pend    { background:var(--accent-light); color:var(--accent); }
        .bdg-expired { background:var(--danger-bg);    color:var(--danger-text); }
        .bdg-soon    { background:var(--warn-light);   color:var(--warn); }
        .bdg-solicit { background:var(--blue-light);   color:var(--blue); }
        .bdg-ok      { background:var(--ok-light);     color:var(--ok); }
        .ch-toggle { color:var(--ink-muted); font-size:.65rem; transition:transform .25s; flex-shrink:0; }
        .ch-toggle.open { transform:rotate(180deg); }

        /* CARD BODY */
        .cb { display:none; border-top:1px solid var(--border); }
        .cb.open { display:block; }

        /* EMP STRIP */
        .emp-strip {
            display:flex; flex-wrap:wrap; background:var(--purple-light);
            border-bottom:1px solid var(--border);
        }
        .es-item {
            padding:7px 14px; border-right:1px solid var(--border);
            flex:1; min-width:110px;
        }
        .es-item:last-child { border-right:none; }
        .es-label { font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-muted); display:block; margin-bottom:1px; }
        .es-val   { font-size:.85rem; font-weight:600; }
        .es-val.hi { color:var(--accent); }

        /* YEAR TABLE */
        .yt { width:100%; border-collapse:collapse; }
        .yt thead tr { background:var(--ink); color:#fff; }
        .yt thead th {
            padding:6px 11px; font-size:.65rem;
            text-transform:uppercase; letter-spacing:.07em; font-weight:500; text-align:left;
        }
        .yt thead th.c { text-align:center; }

        .yr-row { border-bottom:1px solid var(--border); }
        .yr-row:last-child { border-bottom:none; }
        .yr-row.sa       { background:var(--stripe-a); }
        .yr-row.sb       { background:var(--stripe-b); }
        .yr-row.rexp     { background:#fff3f3; }
        .yr-row.rsoon    { background:#fffbf2; }

        .yt td { padding:7px 11px; vertical-align:middle; }
        .yt td.c { text-align:center; }

        .yr-num   { font-weight:700; font-size:.88rem; }
        .yr-dates { font-size:.67rem; color:var(--ink-muted); margin-top:1px; }

        .mini-bar { height:4px; background:var(--border); border-radius:3px; overflow:hidden; width:70px; margin-top:3px; }
        .mini-fill { height:100%; border-radius:3px; }
        .f-ok   { background:var(--ok); }
        .f-part { background:var(--accent); }

        .used-ct  { font-size:.8rem; font-weight:600; }
        .used-sub { font-size:.67rem; color:var(--ink-muted); margin-top:2px; }

        .dcs { display:flex; flex-wrap:wrap; gap:2px; margin-top:3px; }
        .dc  { padding:1px 6px; border-radius:8px; font-size:.65rem; font-weight:500; }
        .dc-done { background:var(--ok-light);  color:var(--ok); }
        .dc-sol  { background:var(--blue-light); color:var(--blue); }

        .pn { font-size:.9rem; font-weight:700; }
        .pn.y { color:var(--accent); }
        .pn.n { color:var(--ok); }

        .vc { display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:10px; font-size:.68rem; font-weight:500; line-height:1.3; }
        .vc-done   { background:var(--ok-light);   color:var(--ok); }
        .vc-nv     { background:#f0f0f8;            color:var(--ink-soft); }
        .vc-exp    { background:var(--danger-bg);   color:var(--danger-text); font-weight:700; }
        .vc-soon   { background:var(--warn-light);  color:var(--warn); font-weight:700; }
        .vc-future { background:#f0f0f8;            color:var(--ink-soft); }

        /* solicitados sub-row */
        .sol-row td {
            background:#f0f7ff; border-top:1px dashed #b8d4f0;
            font-size:.75rem; color:var(--blue); padding:5px 11px;
        }

        /* totals */
        .tot-row td {
            background:var(--ink); color:#fff;
            font-weight:600; font-size:.8rem; padding:7px 11px;
        }
        .tot-row td.c { text-align:center; }

        .print-btn {
            display:inline-flex; align-items:center; gap:4px;
            margin:8px 14px 10px;
            padding:6px 13px; background:var(--ink); color:#fff;
            border:none; border-radius:7px; font-size:.75rem;
            font-family:'DM Sans',sans-serif; cursor:pointer;
        }
        .print-btn:hover { opacity:.82; }

        /* loading */
        #loadingScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:60vh; gap:14px; color:var(--ink-soft); }
        .spinner { width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .err { margin:28px; padding:14px 18px; background:var(--danger-bg); color:var(--danger-text); border-radius:8px; font-size:.85rem; }

        /* PRINT */
        @media print {
            body { background:white; font-size:11px; }
            .site-header,.summary-bar,.controls,.print-btn,.ch-toggle { display:none !important; }
            .emp-list { padding:0; gap:14px; }
            .emp-card { display:none !important; box-shadow:none; border:1px solid #ccc; page-break-after:always; }
            .emp-card.printing { display:block !important; }
            .cb { display:block !important; }
        }
        @media (max-width:600px) {
            .site-header,.summary-bar,.controls,.emp-list { padding-left:12px; padding-right:12px; }
            .yt thead th:nth-child(2),.yt td:nth-child(2) { display:none; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div>
        <h1>🏖 Control de Vacaciones</h1>
        <small>Paz Mental S.A.P.I. de C.V.</small>
    </div>
    <div id="lastUpdate"></div>
</header>

<div id="loadingScreen">
    <div class="spinner"></div>
    <p>Cargando datos…</p>
</div>

<div id="appContent" style="display:none">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="controls">
        <input class="search-input" id="searchInput" placeholder="🔍 Buscar empleado…" oninput="filterCards()">
        <button class="fbtn active" onclick="setFilter('todos',this)">Todos</button>
        <button class="fbtn" onclick="setFilter('pendientes',this)">Con pendientes</button>
        <button class="fbtn" onclick="setFilter('vencidos',this)">⚠ Vencidos</button>
        <button class="fbtn" onclick="setFilter('proximos',this)">⏰ Próximos 30d</button>
        <button class="fbtn" onclick="setFilter('solicitados',this)">📋 Solicitados</button>
    </div>
    <div class="emp-list" id="empList"></div>
</div>

<script>
const SHEET_ID = '1LspktCHoVlK4QDGY6-gB162B5Y2BBJxS6IlCBPiClv8';
let empleados=[], vacaciones=[], currentFilter='todos';

const tablaVieja={1:6,2:8,3:10,4:12,5:14,6:14,7:14,8:14,9:14,10:16,11:16,12:16,13:16,14:16,15:18};
const tablaNueva={1:12,2:14,3:16,4:18,5:20,6:22,7:22,8:22,9:22,10:22,11:24,12:24,13:24,14:24,15:24};
const corte2023=new Date(2023,0,1);

function parseDate(v){
    if(!v) return null;
    const s=v.toString();
    const m=s.match(/Date\((\d+),(\d+),(\d+)\)/);
    if(m) return new Date(+m[1],+m[2],+m[3]);
    if(s.includes('-')){
        const p=s.split('-');
        if(p.length===3){let[d,mo,y]=p.map(Number);if(y<100)y+=2000;return new Date(y,mo-1,d);}
    }
    const dt=new Date(v); return isNaN(dt)?null:dt;
}
function fmt(d,short){
    if(!d) return '—';
    return d.toLocaleDateString('es-MX',short?{day:'2-digit',month:'short',year:'2-digit'}:{day:'2-digit',month:'short',year:'numeric'});
}
function fmtFull(d){ return d?d.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'}):'—'; }
function initials(n){ return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function money(n){ return n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function getDias(ing,anio){
    const ap=new Date(ing); ap.setFullYear(ing.getFullYear()+anio);
    const t=ap<corte2023?tablaVieja:tablaNueva;
    return t[Math.min(anio,15)]||(ap<corte2023?18:24);
}

function calcular(emp){
    const hoy=new Date(), ing=emp.fechaIngreso;
    if(!ing) return [];
    let abiertos=0;
    for(let a=1;a<=50;a++){
        const ap=new Date(ing); ap.setFullYear(ing.getFullYear()+a);
        if(ap<=hoy) abiertos=a; else break;
    }
    const res=[];
    for(let anio=1;anio<=abiertos;anio++){
        const apertura=new Date(ing); apertura.setFullYear(ing.getFullYear()+anio);
        const cierre=new Date(ing);   cierre.setFullYear(ing.getFullYear()+anio+1); cierre.setDate(cierre.getDate()-1);
        const diasTocan=getDias(ing,anio);
        const vacsAnio=vacaciones.filter(v=>v.num===emp.numero&&v.anio===anio);

        const hayPagadas  =vacsAnio.some(v=>v.status==='Pagadas');
        const haySinFecha =vacsAnio.some(v=>v.status==='Disfrutadas sin fecha');

        let diasPag=0,diasSF=0,diasDis=0;
        const detsDis=[], detsSol=[];

        if(hayPagadas){ diasPag=diasTocan; }
        else if(haySinFecha){ diasSF=diasTocan; }
        else {
            vacsAnio.forEach(v=>{
                if(v.status==='Por disfrutar'&&v.fecha) detsSol.push(v.fecha);
                else if(v.fecha){ diasDis++; detsDis.push(v.fecha); }
            });
        }

        const usados=diasDis+diasPag+diasSF;
        const pendientes=Math.max(0,diasTocan-usados);

        let vencimiento=null,diasParaVencer=null,estadoVenc='done';
        if(pendientes>0){
            if(apertura.getFullYear()>=2025){
                vencimiento=cierre;
                diasParaVencer=Math.ceil((cierre-new Date())/86400000);
                estadoVenc=diasParaVencer<0?'expired':diasParaVencer<=30?'soon':'future';
            } else { estadoVenc='no-vence'; }
        }

        res.push({anio,apertura,cierre,diasTocan,diasDis,diasPag,diasSF,
            usados,pendientes,detsDis,detsSol,
            hayPagadas,haySinFecha,
            vencimiento,diasParaVencer,estadoVenc});
    }
    return res;
}

function renderAll(){
    const list=document.getElementById('empList');
    list.innerHTML='';
    let totPend=0,totVenc=0,totSoon=0,totOk=0,totSol=0;

    empleados.forEach(emp=>{
        const per=calcular(emp);
        const pend=per.reduce((s,p)=>s+p.pendientes,0);
        const tieneVenc=per.some(p=>p.estadoVenc==='expired'&&p.pendientes>0);
        const tieneSoon=per.some(p=>p.estadoVenc==='soon'&&p.pendientes>0);
        const tieneSol =per.some(p=>p.detsSol.length>0);
        if(pend>0)   totPend++;
        if(tieneVenc)totVenc++;
        if(tieneSoon)totSoon++;
        if(pend===0) totOk++;
        if(tieneSol) totSol++;
        list.appendChild(buildCard(emp,per,pend,tieneVenc,tieneSoon,tieneSol));
    });

    document.getElementById('summaryBar').innerHTML=`
        <div class="s-pill"><div class="s-dot" style="background:var(--ink)"></div><span><strong>${empleados.length}</strong> empleados</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--accent)"></div><span><strong>${totPend}</strong> con pendientes</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--danger-text)"></div><span><strong>${totVenc}</strong> vencidos</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--warn)"></div><span><strong>${totSoon}</strong> vencen pronto</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--blue)"></div><span><strong>${totSol}</strong> con solicitados</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--ok)"></div><span><strong>${totOk}</strong> al corriente</span></div>
    `;
    document.getElementById('lastUpdate').textContent='Actualizado: '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}

function buildCard(emp,per,pend,tieneVenc,tieneSoon,tieneSol){
    const card=document.createElement('div');
    card.className='emp-card'+(tieneVenc?' has-expired':tieneSoon?' has-soon':'');
    card.dataset.nombre=emp.nombre.toLowerCase();
    card.dataset.filter=tieneVenc?'vencidos':tieneSoon?'proximos':pend>0?'pendientes':'ok';
    card.dataset.sol=tieneSol?'1':'0';

    const anios=per.length;
    const vd=pend*emp.salarioDiario, pr=vd*.25, tot=vd+pr;

    let bdgs='';
    if(pend>0)    bdgs+=`<span class="bdg bdg-pend">${pend} pend.</span>`;
    if(tieneVenc) bdgs+=`<span class="bdg bdg-expired">⚠ Vencidos</span>`;
    else if(tieneSoon) bdgs+=`<span class="bdg bdg-soon">⏰ Pronto</span>`;
    if(tieneSol)  bdgs+=`<span class="bdg bdg-solicit">📋 Solicitados</span>`;
    if(pend===0&&!tieneSol) bdgs+=`<span class="bdg bdg-ok">✓ Al corriente</span>`;

    let rows='', totD=0,totU=0,totP=0;
    per.forEach((p,i)=>{
        totD+=p.diasTocan; totU+=p.usados; totP+=p.pendientes;
        const pct=p.diasTocan>0?Math.round(p.usados/p.diasTocan*100):100;
        const fillCls=pct>=100?'f-ok':'f-part';
        const rowCls=p.estadoVenc==='expired'&&p.pendientes>0?'rexp':
                     p.estadoVenc==='soon'&&p.pendientes>0?'rsoon':
                     i%2===0?'sa':'sb';

        let usadoHtml='';
        if(p.hayPagadas)      usadoHtml=`<span class="dc dc-done">Todos pagados</span>`;
        else if(p.haySinFecha) usadoHtml=`<span class="dc dc-done">Sin fecha</span>`;
        else if(p.detsDis.length>0){
            usadoHtml=`<div class="dcs">${p.detsDis.map(d=>`<span class="dc dc-done">${fmt(d,true)}</span>`).join('')}</div>`;
        } else usadoHtml=`<span style="color:var(--ink-muted)">—</span>`;

        let vChip='';
        if(p.pendientes===0)              vChip=`<span class="vc vc-done">✓ Listo</span>`;
        else if(p.estadoVenc==='no-vence') vChip=`<span class="vc vc-nv">Sin vencimiento</span>`;
        else if(p.estadoVenc==='expired')  vChip=`<span class="vc vc-exp">⚠ Venció ${fmt(p.vencimiento)}</span>`;
        else if(p.estadoVenc==='soon')     vChip=`<span class="vc vc-soon">⏰ ${p.diasParaVencer}d · ${fmt(p.vencimiento)}</span>`;
        else                               vChip=`<span class="vc vc-future">${fmt(p.vencimiento)}</span>`;

        rows+=`
        <tr class="yr-row ${rowCls}">
            <td><div class="yr-num">Año ${p.anio}</div><div class="yr-dates">${fmt(p.apertura,true)} → ${fmt(p.cierre,true)}</div></td>
            <td class="c" style="font-weight:600">${p.diasTocan}</td>
            <td>
                <div class="used-ct">${p.usados} / ${p.diasTocan}</div>
                <div class="mini-bar"><div class="mini-fill ${fillCls}" style="width:${pct}%"></div></div>
                <div class="used-sub">${usadoHtml}</div>
            </td>
            <td class="c"><span class="pn ${p.pendientes>0?'y':'n'}">${p.pendientes}</span></td>
            <td>${vChip}</td>
        </tr>`;

        if(p.detsSol.length>0){
            rows+=`
            <tr class="sol-row">
                <td colspan="5">
                    📋 <strong>${p.detsSol.length} día${p.detsSol.length>1?'s':''} ya solicitados, pendientes de tomar:</strong>
                    <div class="dcs" style="margin-top:3px">${p.detsSol.map(d=>`<span class="dc dc-sol">${fmt(d,true)}</span>`).join('')}</div>
                </td>
            </tr>`;
        }
    });

    card.innerHTML=`
    <div class="ch" onclick="toggleCard(this)">
        <div class="avatar">${initials(emp.nombre)}</div>
        <div class="ch-name">
            <strong>${emp.nombre}</strong>
            <span>#${emp.numero} · ${emp.equipo||'Sin equipo'} · Año ${anios}</span>
        </div>
        <div class="ch-badges">${bdgs}</div>
        <span class="ch-toggle">▼</span>
    </div>
    <div class="cb">
        <div class="emp-strip">
            <div class="es-item"><span class="es-label">Ingreso</span><span class="es-val">${fmtFull(emp.fechaIngreso)}</span></div>
            <div class="es-item"><span class="es-label">Antigüedad</span><span class="es-val">Año ${anios}</span></div>
            <div class="es-item"><span class="es-label">Días pendientes</span><span class="es-val hi">${pend}</span></div>
            <div class="es-item"><span class="es-label">Salario diario</span><span class="es-val">$${money(emp.salarioDiario)}</span></div>
            <div class="es-item"><span class="es-label">Valor días</span><span class="es-val">$${money(vd)}</span></div>
            <div class="es-item"><span class="es-label">Prima 25%</span><span class="es-val">$${money(pr)}</span></div>
            <div class="es-item"><span class="es-label">Total pasivo</span><span class="es-val hi">$${money(tot)}</span></div>
        </div>
        <table class="yt">
            <thead><tr>
                <th>Periodo</th>
                <th class="c">Días</th>
                <th>Usados / Detalle</th>
                <th class="c">Pend.</th>
                <th>Vencimiento</th>
            </tr></thead>
            <tbody>${rows}</tbody>
            <tfoot><tr class="tot-row">
                <td>TOTAL</td>
                <td class="c">${totD}</td>
                <td>${totU} usados</td>
                <td class="c">${totP}</td>
                <td></td>
            </tr></tfoot>
        </table>
        <button class="print-btn" onclick="printEmp('${emp.nombre.replace(/'/g,"\\'")}')">🖨 Imprimir / PDF</button>
    </div>`;

    return card;
}

function toggleCard(ch){
    const cb=ch.nextElementSibling,tg=ch.querySelector('.ch-toggle');
    cb.classList.toggle('open'); tg.classList.toggle('open',cb.classList.contains('open'));
}
function setFilter(f,btn){
    currentFilter=f;
    document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); filterCards();
}
function filterCards(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.emp-card').forEach(c=>{
        const mn=c.dataset.nombre.includes(q);
        const mf=currentFilter==='todos'?true:
            currentFilter==='pendientes'?c.dataset.filter!=='ok':
            currentFilter==='vencidos'  ?c.dataset.filter==='vencidos':
            currentFilter==='proximos'  ?c.dataset.filter==='proximos':
            currentFilter==='solicitados'?c.dataset.sol==='1':true;
        c.style.display=mn&&mf?'':'none';
    });
}
function printEmp(nombre){
    document.querySelectorAll('.emp-card').forEach(c=>c.classList.remove('printing'));
    const t=[...document.querySelectorAll('.emp-card')].find(c=>c.dataset.nombre===nombre.toLowerCase());
    if(t){t.classList.add('printing');t.querySelector('.cb').classList.add('open');}
    window.print();
    setTimeout(()=>document.querySelectorAll('.emp-card').forEach(c=>c.classList.remove('printing')),1000);
}

async function loadData(){
    try{
        const[er,vr]=await Promise.all([
            fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Empleados`),
            fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Vacaciones_Tomadas`)
        ]);
        const et=await er.text(),vt=await vr.text();
        const ej=JSON.parse(et.substring(47).slice(0,-2));
        const vj=JSON.parse(vt.substring(47).slice(0,-2));

        empleados=ej.table.rows.map(r=>({
            numero:String(r.c[0]?.v||''),
            nombre:r.c[1]?.v||'',
            fechaIngreso:parseDate(r.c[2]?.v||r.c[2]?.f),
            salarioDiario:parseFloat(r.c[3]?.v||0),
            equipo:r.c[4]?.v||'',
            rol:r.c[5]?.v||'Empleado'
        }));
        vacaciones=vj.table.rows.map(r=>({
            num:String(r.c[0]?.v||''),
            fecha:parseDate(r.c[1]?.v||r.c[1]?.f),
            anio:parseInt(r.c[2]?.v||0),
            status:r.c[3]?.v||'Disfrutadas'
        }));

        document.getElementById('loadingScreen').style.display='none';
        document.getElementById('appContent').style.display='block';
        renderAll();
    } catch(e){
        document.getElementById('loadingScreen').innerHTML=
            `<div class="err">❌ Error al cargar. Abre desde GitHub Pages, no desde archivo local.<br><small>${e.message}</small></div>`;
    }
}
window.onload=loadData;
</script>
</body>
</html>
