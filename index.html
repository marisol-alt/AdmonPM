<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacaciones · Paz Mental</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:#1c1c2e; --ink-soft:#52526e; --ink-muted:#9898b8;
            --bg:#f0eff8; --white:#fff;
            --accent:#6c5ce7; --accent-light:#ede9fd;
            --ok:#00836e; --ok-light:#d4f5ef;
            --warn:#b86200; --warn-light:#fdecd4;
            --red:#a61c1c; --red-light:#fde8e8;
            --blue:#1a6fb5; --blue-light:#dceeff;
            --purple-light:#f0edff;
            --border:#e2e0f0;
            --sa:#f7f6ff; --sb:#f2faf8;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.4;}

        /* HEADER */
        .hdr{background:var(--ink);color:#fff;padding:11px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.3);}
        .hdr h1{font-family:'DM Serif Display',serif;font-size:1.1rem;}
        .hdr small{color:rgba(255,255,255,.4);font-size:.7rem;margin-left:8px;}
        #lastUpd{font-size:.7rem;color:rgba(255,255,255,.35);}

        /* SUMMARY */
        .sbar{background:var(--white);border-bottom:1px solid var(--border);padding:9px 28px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;}
        .sp{display:flex;align-items:center;gap:6px;font-size:.78rem;}
        .sd{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
        .sp strong{font-size:.95rem;font-weight:600;}

        /* CONTROLS */
        .ctrl{padding:10px 28px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
        .sinput{padding:6px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:.8rem;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--ink);width:200px;}
        .sinput:focus{outline:none;border-color:var(--accent);}
        .fb{padding:5px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:.75rem;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--ink-soft);cursor:pointer;transition:all .15s;}
        .fb.active,.fb:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
        .fb-rep{padding:5px 14px;border:1.5px solid var(--accent);border-radius:7px;font-size:.75rem;font-family:'DM Sans',sans-serif;background:var(--accent-light);color:var(--accent);cursor:pointer;font-weight:600;transition:all .15s;margin-left:6px;}
        .fb-rep:hover{background:var(--accent);color:#fff;}

        /* LIST */
        .elist{padding:10px 28px 60px;display:flex;flex-direction:column;gap:8px;}

        /* CARD */
        .ecard{background:var(--white);border:1px solid var(--border);border-radius:9px;overflow:hidden;box-shadow:0 1px 5px rgba(28,28,46,.05);}
        .ecard.has-exp{border-left:3px solid var(--red);}
        .ecard.has-soon{border-left:3px solid var(--warn);}

        /* CARD HEADER */
        .ch{padding:10px 16px;display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;background:var(--white);transition:background .15s;}
        .ch:hover{background:#fafafe;}
        .av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:.85rem;flex-shrink:0;}
        .cn{flex:1;min-width:0;}
        .cn strong{font-size:.9rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .cn span{font-size:.7rem;color:var(--ink-muted);}
        .cbdgs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
        .bdg{padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:500;white-space:nowrap;}
        .bdg-p{background:var(--accent-light);color:var(--accent);}
        .bdg-e{background:var(--red-light);color:var(--red);}
        .bdg-s{background:var(--warn-light);color:var(--warn);}
        .bdg-sol{background:var(--blue-light);color:var(--blue);}
        .bdg-ok{background:var(--ok-light);color:var(--ok);}
        .ctg{color:var(--ink-muted);font-size:.65rem;transition:transform .25s;flex-shrink:0;}
        .ctg.open{transform:rotate(180deg);}

        /* CARD BODY */
        .cb{display:none;border-top:1px solid var(--border);}
        .cb.open{display:block;}

        /* EMP STRIP */
        .estrip{display:flex;flex-wrap:nowrap;background:var(--purple-light);border-bottom:1px solid var(--border);align-items:stretch;overflow-x:auto;}
        .ei{padding:6px 10px;border-right:1px solid var(--border);flex:1;min-width:90px;}
        .ei-sm{padding:6px 10px;border-right:1px solid var(--border);flex:none;min-width:120px;}
        .ei-sep{width:1px;background:var(--border);flex:none;margin:4px 0;}
        .warn-lbl{color:var(--warn)!important;}
        .blue-lbl{color:var(--blue)!important;}
        .ei:last-child{border-right:none;}
        .eilbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);display:block;margin-bottom:1px;}
        .eival{font-size:.85rem;font-weight:600;}
        .eival.hi{color:var(--accent);}

        /* SECTION DIVIDERS */
        .sec-hdr{
            padding:6px 14px;font-size:.68rem;font-weight:600;
            text-transform:uppercase;letter-spacing:.07em;
            display:flex;align-items:center;gap:8px;
        }
        .sec-hdr.adeudo{background:#fff8f0;color:var(--warn);border-bottom:1px solid #f5dfc0;}
        .sec-hdr.portomar{background:#f0f7ff;color:var(--blue);border-bottom:1px solid #c8dff5;}
        .sec-hdr.completo{background:var(--ok-light);color:var(--ok);border-bottom:1px solid #b0e8d8;}
        .sec-badge{background:rgba(0,0,0,.08);padding:1px 8px;border-radius:10px;font-size:.65rem;}

        /* YEAR TABLE */
        .yt{width:100%;border-collapse:collapse;}
        .yt thead tr{background:#2d2b45;color:#fff;}
        .yt thead th{padding:5px 10px;font-size:.63rem;text-transform:uppercase;letter-spacing:.07em;font-weight:500;text-align:left;}
        .yt thead th.c{text-align:center;}
        .yr{border-bottom:1px solid var(--border);}
        .yr:last-child{border-bottom:none;}
        .yr.sa{background:var(--sa);}
        .yr.sb{background:var(--sb);}
        .yr.rexp{background:#fff3f3;}
        .yr.rsoon{background:#fffbf2;}
        .yt td{padding:6px 10px;vertical-align:middle;}
        .yt td.c{text-align:center;}
        .yn{font-weight:700;font-size:.85rem;}
        .yd{font-size:.65rem;color:var(--ink-muted);margin-top:1px;}
        .mbar{height:4px;background:var(--border);border-radius:3px;overflow:hidden;width:60px;margin-top:3px;}
        .mfill{height:100%;border-radius:3px;}
        .f-ok{background:var(--ok);}
        .f-pt{background:var(--accent);}
        .uct{font-size:.78rem;font-weight:600;}
        .usub{font-size:.65rem;color:var(--ink-muted);margin-top:2px;}
        .pn{font-size:.9rem;font-weight:700;}
        .pn.y{color:var(--accent);}
        .pn.n{color:var(--ok);}
        .dc-done{display:inline-block;background:var(--ok-light);color:var(--ok);padding:1px 7px;border-radius:8px;font-size:.65rem;font-weight:500;}

        /* VENC CHIPS */
        .vc{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:.67rem;font-weight:500;line-height:1.3;}
        .vc-nv{background:#f0f0f8;color:var(--ink-soft);}
        .vc-exp{background:var(--red-light);color:var(--red);font-weight:700;}
        .vc-soon{background:var(--warn-light);color:var(--warn);font-weight:700;}
        .vc-fut{background:#eef3fa;color:var(--blue);}

        /* MONEY INLINE */
        .money-ref{font-size:.67rem;color:var(--ink-muted);margin-top:2px;}
        .money-ref span{color:var(--accent);font-weight:600;}

        /* SOL ROW */
        .solrow td{background:#f0f7ff;border-top:1px dashed #b8d4f0;font-size:.73rem;color:var(--blue);padding:4px 10px;}

        /* TOTALS */
        .trow td{background:var(--ink);color:#fff;font-weight:600;font-size:.78rem;padding:6px 10px;}
        .trow td.c{text-align:center;}

        /* FECHA LISTS */
        .ftgl{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;color:var(--blue);cursor:pointer;margin-top:3px;background:var(--blue-light);padding:2px 8px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;user-select:none;}
        .ftgl:hover{opacity:.8;}
        .flst{display:none;margin-top:4px;border-left:2px solid var(--border);padding-left:7px;}
        .flst.open{display:block;}
        .fi{font-size:.7rem;padding:2px 0;color:var(--ink-soft);border-bottom:1px solid #f0eef8;display:flex;gap:5px;}
        .fi:last-child{border-bottom:none;}
        .fn{font-weight:600;color:var(--ink);min-width:14px;text-align:right;}
        .fdia{color:var(--ink-muted);min-width:50px;}
        .fdate{color:var(--ink);}
        .fi.sol .fdia{color:#6da8e0;}
        .fi.sol .fdate{color:var(--blue);}

        /* ACTIONS */
        .cacts{display:flex;gap:7px;margin:8px 14px 10px;flex-wrap:wrap;}
        .pbtn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:none;border-radius:7px;font-size:.73rem;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;}
        .pbtn-dark{background:var(--ink);color:#fff;}
        .pbtn-dark:hover{opacity:.85;}
        .pbtn-outline{background:var(--white);color:var(--ink);border:1.5px solid var(--border);}
        .pbtn-outline:hover{background:#f5f4f0;}

        /* LOADING */
        #loadScr{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:14px;color:var(--ink-soft);}
        .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .err{margin:28px;padding:14px 18px;background:var(--red-light);color:var(--red);border-radius:8px;font-size:.85rem;}

        /* ═══════════════════════════
           REPORT MODAL
        ═══════════════════════════ */
        #repModal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.55);align-items:center;justify-content:center;}
        #repModal.open{display:flex;}
        .mbox{background:var(--white);border-radius:12px;width:min(900px,96vw);max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
        .mhdr{background:var(--ink);color:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:12px 12px 0 0;position:sticky;top:0;z-index:10;}
        .mhdr h2{font-family:'DM Serif Display',serif;font-size:1.05rem;}
        .mclose{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.78rem;}
        .macts{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px;}
        .rwrap{padding:16px 20px 28px;}

        /* REPORT CONTENT */
        .rmeta{font-size:.75rem;color:var(--ink-muted);margin-bottom:16px;}
        .rmeta strong{color:var(--ink);}

        /* report table */
        .rtbl{width:100%;border-collapse:collapse;font-size:.8rem;}
        .rtbl thead tr{background:var(--ink);color:#fff;}
        .rtbl thead th{padding:8px 12px;text-align:left;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;font-weight:500;border-right:1px solid rgba(255,255,255,.1);}
        .rtbl thead th:last-child{border-right:none;}
        .rtbl tbody tr{border-bottom:1px solid var(--border);}
        .rtbl tbody tr:nth-child(even){background:#faf9ff;}
        .rtbl tbody tr:last-child{border-bottom:none;}
        .rtbl td{padding:9px 12px;vertical-align:top;border-right:1px solid var(--border);}
        .rtbl td:last-child{border-right:none;}
        .rtbl tfoot tr{background:var(--ink);color:#fff;}
        .rtbl tfoot td{padding:8px 12px;font-weight:600;font-size:.8rem;border-right:1px solid rgba(255,255,255,.1);}
        .rtbl tfoot td:last-child{border-right:none;}

        .rname{font-weight:600;font-size:.85rem;}
        .rsub{font-size:.68rem;color:var(--ink-muted);margin-top:2px;}

        /* pasivo cell */
        .pc-dias{font-size:1.1rem;font-weight:700;color:var(--warn);}
        .pc-breakdown{font-size:.68rem;color:var(--ink-muted);margin-top:3px;line-height:1.6;}
        .pc-total{font-size:.9rem;font-weight:700;color:var(--red);}

        /* portomar cell */
        .pt-dias{font-size:1.1rem;font-weight:700;color:var(--blue);}
        .pt-sub{font-size:.68rem;color:var(--ink-muted);margin-top:3px;}
        .pt-venc{margin-top:5px;}
        .vchip{display:inline-block;padding:1px 7px;border-radius:8px;font-size:.65rem;font-weight:500;margin-right:3px;}
        .vchip-e{background:var(--red-light);color:var(--red);}
        .vchip-s{background:var(--warn-light);color:var(--warn);}
        .vchip-f{background:#eef3fa;color:var(--blue);}

        /* totals box */
        .rtots{display:flex;gap:0;margin-top:20px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
        .rto{flex:1;padding:14px 12px;text-align:center;border-right:1px solid var(--border);}
        .rto:last-child{border-right:none;}
        .rto-v{font-size:1.15rem;font-weight:700;}
        .rto-l{font-size:.65rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}
        .rto.accent{background:var(--accent-light);}
        .rto.accent .rto-v{color:var(--accent);}
        .rto.red-bg{background:var(--red-light);}
        .rto.red-bg .rto-v{color:var(--red);}
        .rto.blue-bg{background:var(--blue-light);}
        .rto.blue-bg .rto-v{color:var(--blue);}

        /* ═══════════════════════════
           PRINT
        ═══════════════════════════ */
        @media print{
            body{background:white;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
            .hdr,.sbar,.ctrl,#repModal,.cacts,.ctg,.ftgl{display:none !important;}
            .elist{padding:0;gap:0;}

            /* detail print */
            .ecard{display:none !important;box-shadow:none;border:1px solid #ccc !important;border-radius:0;margin-bottom:0;page-break-after:always;}
            .ecard.printing{display:block !important;}
            .cb{display:block !important;}
            .flst{display:block !important;}
            .ch{cursor:default;background:#f5f4f0 !important;}
            .yr.sa{background:#f7f6ff !important;}
            .yr.sb{background:#f2faf8 !important;}
            .yr.rexp{background:#fff3f3 !important;}
            .yr.rsoon{background:#fffbf2 !important;}
            .estrip{background:#ede9fd !important;}
            .yt thead tr,.trow td{background:#1c1c2e !important;}
            .sec-hdr.adeudo{background:#fff8f0 !important;}
            .sec-hdr.portomar{background:#f0f7ff !important;}
            .sec-hdr.completo{background:#d4f5ef !important;}

            /* compact print: hide fecha lists */
            .ecard.print-compact .flst{display:none !important;}
            .ecard.print-compact .ftgl{display:none !important;}
            .ecard.print-compact .solrow{display:none !important;}

            /* report print */
            #repPrint{display:block !important;}
            .ecard,.elist{display:none !important;}
        }

        #repPrint{display:none;}

        @media(max-width:600px){
            .hdr,.sbar,.ctrl,.elist{padding-left:12px;padding-right:12px;}
            .yt thead th:nth-child(2),.yt td:nth-child(2){display:none;}
        }
    </style>
</head>
<body>

<header class="hdr">
    <div><h1>🏖 Control de Vacaciones</h1><small>Paz Mental S.A.P.I. de C.V.</small></div>
    <div id="lastUpd"></div>
</header>

<div id="loadScr"><div class="spin"></div><p>Cargando datos…</p></div>

<div id="app" style="display:none">
    <div class="sbar" id="sBar"></div>
    <div class="ctrl">
        <input class="sinput" id="srch" placeholder="🔍 Buscar empleado…" oninput="filterCards()">
        <button class="fb active" onclick="setFilter('todos',this)">Todos</button>
        <button class="fb" onclick="setFilter('pendientes',this)">Con pendientes</button>
        <button class="fb" onclick="setFilter('vencidos',this)">⚠ Vencidos</button>
        <button class="fb" onclick="setFilter('proximos',this)">⏰ Próximos 30d</button>
        <button class="fb" onclick="setFilter('solicitados',this)">📋 Solicitados</button>
        <button class="fb-rep" onclick="openReport()">📊 Reporte Dirección</button>
    </div>
    <div class="elist" id="eList"></div>
</div>

<!-- REPORT MODAL -->
<div id="repModal">
    <div class="mbox">
        <div class="mhdr">
            <h2>📊 Reporte de Vacaciones · Paz Mental S.A.P.I. de C.V.</h2>
            <button class="mclose" onclick="closeReport()">✕ Cerrar</button>
        </div>
        <div class="macts">
            <button class="pbtn pbtn-dark" onclick="printReport()">🖨 Imprimir / PDF</button>
        </div>
        <div class="rwrap" id="repContent"></div>
    </div>
</div>

<!-- hidden report print area -->
<div id="repPrint"></div>

<script>
const SHEET_ID='1LspktCHoVlK4QDGY6-gB162B5Y2BBJxS6IlCBPiClv8';
let emps=[],vacs=[],curFilter='todos';

const tV={1:6,2:8,3:10,4:12,5:14,6:14,7:14,8:14,9:14,10:16,11:16,12:16,13:16,14:16,15:18};
const tN={1:12,2:14,3:16,4:18,5:20,6:22,7:22,8:22,9:22,10:22,11:24,12:24,13:24,14:24,15:24};
const c23=new Date(2023,0,1);

function parseDate(v){
    if(!v)return null;
    const s=v.toString();
    const m=s.match(/Date\((\d+),(\d+),(\d+)\)/);
    if(m)return new Date(+m[1],+m[2],+m[3]);
    if(s.includes('-')){const p=s.split('-');if(p.length===3){let[d,mo,y]=p.map(Number);if(y<100)y+=2000;return new Date(y,mo-1,d);}}
    const dt=new Date(v);return isNaN(dt)?null:dt;
}
function fmt(d,s){if(!d)return'—';return d.toLocaleDateString('es-MX',s?{day:'2-digit',month:'short',year:'2-digit'}:{day:'2-digit',month:'short',year:'numeric'});}
function fmtFull(d){return d?d.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'}):'—';}
function fmtDia(d){if(!d)return{dia:'—',fecha:'—'};return{dia:d.toLocaleDateString('es-MX',{weekday:'short'}),fecha:d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})};}
function ini(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function money(n){return'$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function getDias(ing,anio){const ap=new Date(ing);ap.setFullYear(ing.getFullYear()+anio);const t=ap<c23?tV:tN;return t[Math.min(anio,15)]||(ap<c23?18:24);}

/* ── CORE CALC ── */
function calcular(emp){
    const hoy=new Date(),ing=emp.fi;
    if(!ing)return[];
    let ab=0;
    for(let a=1;a<=50;a++){const ap=new Date(ing);ap.setFullYear(ing.getFullYear()+a);if(ap<=hoy)ab=a;else break;}
    const res=[];
    for(let anio=1;anio<=ab;anio++){
        const ap=new Date(ing);ap.setFullYear(ing.getFullYear()+anio);
        const ci=new Date(ing);ci.setFullYear(ing.getFullYear()+anio+1);ci.setDate(ci.getDate()-1);
        const dt=getDias(ing,anio);
        const va=vacs.filter(v=>v.num===emp.num&&v.anio===anio);
        const hayP=va.some(v=>v.st==='Pagadas');
        const haySF=va.some(v=>v.st==='Disfrutadas sin fecha');
        let dp=0,dsf=0,dd=0;const detD=[],detS=[];
        if(hayP){dp=dt;}
        else if(haySF){dsf=dt;}
        else{va.forEach(v=>{if(v.st==='Por disfrutar'&&v.f)detS.push(v.f);else if(v.f){dd++;detD.push(v.f);}});}
        const us=dd+dp+dsf;
        const pend=Math.max(0,dt-us);
        let venc=null,dpv=null,ev='completo';
        if(pend>0){
            if(ap.getFullYear()>=2025){
                venc=ci;dpv=Math.ceil((ci-new Date())/86400000);
                ev=dpv<0?'exp':dpv<=30?'soon':'fut';
            }else ev='nv';
        }
        res.push({anio,ap,ci,dt,dd,dp,dsf,us,pend,detD,detS,hayP,haySF,venc,dpv,ev});
    }
    return res;
}

/* ── RENDER ALL ── */
function renderAll(){
    const list=document.getElementById('eList');list.innerHTML='';
    let tP=0,tV2=0,tS=0,tOk=0,tSol=0;
    emps.forEach(emp=>{
        const per=calcular(emp);
        const pend=per.reduce((s,p)=>s+p.pend,0);
        const tv=per.some(p=>p.ev==='exp'&&p.pend>0);
        const ts=per.some(p=>p.ev==='soon'&&p.pend>0);
        const tsol=per.some(p=>p.detS.length>0);
        if(pend>0)tP++;if(tv)tV2++;if(ts)tS++;if(pend===0)tOk++;if(tsol)tSol++;
        list.appendChild(buildCard(emp,per,pend,tv,ts,tsol));
    });
    document.getElementById('sBar').innerHTML=`
        <div class="sp"><div class="sd" style="background:var(--ink)"></div><span><strong>${emps.length}</strong> empleados</span></div>
        <div class="sp"><div class="sd" style="background:var(--accent)"></div><span><strong>${tP}</strong> con pendientes</span></div>
        <div class="sp"><div class="sd" style="background:var(--red)"></div><span><strong>${tV2}</strong> vencidos</span></div>
        <div class="sp"><div class="sd" style="background:var(--warn)"></div><span><strong>${tS}</strong> vencen pronto</span></div>
        <div class="sp"><div class="sd" style="background:var(--blue)"></div><span><strong>${tSol}</strong> solicitados</span></div>
        <div class="sp"><div class="sd" style="background:var(--ok)"></div><span><strong>${tOk}</strong> al corriente</span></div>`;
    document.getElementById('lastUpd').textContent='Actualizado: '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}

/* ── BUILD CARD ── */
function buildCard(emp,per,pend,tv,ts,tsol){
    const card=document.createElement('div');
    card.className='ecard'+(tv?' has-exp':ts?' has-soon':'');
    card.dataset.n=emp.nombre.toLowerCase();
    card.dataset.f=tv?'vencidos':ts?'proximos':pend>0?'pendientes':'ok';
    card.dataset.sol=tsol?'1':'0';

    const anios=per.length;

    // Separar periodos en dos grupos
    const gAdeudo=per.filter(p=>p.ev==='nv'&&p.pend>0);   // sin vencimiento, adeudo real
    const gPorTomar=per.filter(p=>['exp','soon','fut'].includes(p.ev)&&p.pend>0); // con vencimiento
    const gCompleto=per.filter(p=>p.pend===0);              // ya completos

    // Totales financieros (solo adeudo sin vencimiento = pasivo real)
    const diasAdeudo=gAdeudo.reduce((s,p)=>s+p.pend,0);
    const vd=diasAdeudo*emp.sd;const pr=vd*.25;const tot=vd+pr;

    // Días por tomar (con vencimiento)
    const diasPorTomar=gPorTomar.reduce((s,p)=>s+p.pend,0);

    // Badges
    let bdgs='';
    if(pend>0)bdgs+=`<span class="bdg bdg-p">${pend} pend.</span>`;
    if(tv)bdgs+=`<span class="bdg bdg-e">⚠ Vencidos</span>`;
    else if(ts)bdgs+=`<span class="bdg bdg-s">⏰ Pronto</span>`;
    if(tsol)bdgs+=`<span class="bdg bdg-sol">📋 Solicitados</span>`;
    if(pend===0&&!tsol)bdgs+=`<span class="bdg bdg-ok">✓ Al corriente</span>`;

    // Build table rows for a group
    function buildRows(grupo, showMoney){
        let html='';
        grupo.forEach((p,i)=>{
            const pct=p.dt>0?Math.round(p.us/p.dt*100):100;
            const fc=pct>=100?'f-ok':'f-pt';
            const rc=p.ev==='exp'&&p.pend>0?'rexp':p.ev==='soon'&&p.pend>0?'rsoon':i%2===0?'sa':'sb';
            let uHtml='';
            if(p.hayP)uHtml=`<span class="dc-done">Todos pagados</span>`;
            else if(p.haySF)uHtml=`<span class="dc-done">Sin fecha registrada</span>`;
            else if(p.detD.length>0){
                const id=`d-${emp.num}-${p.anio}`;
                const lst=p.detD.map((d,idx)=>{const{dia,fecha}=fmtDia(d);return`<div class="fi"><span class="fn">${idx+1}.</span><span class="fdia">${dia}</span><span class="fdate">${fecha}</span></div>`;}).join('');
                uHtml=`<button class="ftgl" onclick="tgF('${id}')">📅 ${p.detD.length} fecha${p.detD.length>1?'s':''} ▾</button><div class="flst" id="${id}">${lst}</div>`;
            }else uHtml=`<span style="color:var(--ink-muted)">—</span>`;

            let vChip='';
            if(p.ev==='nv')vChip=`<span class="vc vc-nv">Sin vencimiento</span>`;
            else if(p.ev==='exp')vChip=`<span class="vc vc-exp">⚠ Venció ${fmt(p.venc)}</span>`;
            else if(p.ev==='soon')vChip=`<span class="vc vc-soon">⏰ ${p.dpv}d · ${fmt(p.venc)}</span>`;
            else if(p.ev==='fut')vChip=`<span class="vc vc-fut">${fmt(p.venc)}</span>`;

            let moneyRef='';
            if(showMoney&&p.pend>0){
                const vdd=p.pend*emp.sd,pvv=vdd*.25;
                moneyRef=`<div class="money-ref">Ref: <span>${money(vdd)}</span> + PV <span>${money(pvv)}</span></div>`;
            }

            html+=`<tr class="yr ${rc}">
                <td><div class="yn">Año ${p.anio}</div><div class="yd">${fmt(p.ap,true)} → ${fmt(p.ci,true)}</div></td>
                <td class="c" style="font-weight:600">${p.dt}</td>
                <td><div class="uct">${p.us} / ${p.dt}</div><div class="mbar"><div class="mfill ${fc}" style="width:${pct}%"></div></div><div class="usub">${uHtml}</div></td>
                <td class="c"><span class="pn ${p.pend>0?'y':'n'}">${p.pend}</span></td>
                <td>${vChip}${moneyRef}</td>
            </tr>`;

            if(p.detS.length>0){
                const sid=`s-${emp.num}-${p.anio}`;
                const slst=p.detS.map((d,idx)=>{const{dia,fecha}=fmtDia(d);return`<div class="fi sol"><span class="fn">${idx+1}.</span><span class="fdia">${dia}</span><span class="fdate">${fecha}</span></div>`;}).join('');
                html+=`<tr class="solrow"><td colspan="5">📋 <strong>${p.detS.length} día${p.detS.length>1?'s':''} solicitados, pendientes de tomar</strong> <button class="ftgl" style="margin-left:6px" onclick="tgF('${sid}')">Ver fechas ▾</button><div class="flst" id="${sid}">${slst}</div></td></tr>`;
            }
        });
        return html;
    }

    const thead=`<thead><tr><th>Periodo</th><th class="c">D\u00edas</th><th>Usados / Detalle</th><th class="c">Pend.</th><th>Vencimiento</th></tr></thead>`;

    // All pending periods sorted by year, one flat table
    let allRows='';
    const pendientes=[...gAdeudo,...gPorTomar].sort((a,b)=>a.anio-b.anio);
    allRows+=buildRows(pendientes,true);

    if(gCompleto.length>0){
        const compId=`comp-${emp.num}`;
        let compRows='';
        gCompleto.forEach((p,i)=>{
            let uHtml='';
            if(p.hayP)uHtml=`<span class="dc-done">Todos pagados</span>`;
            else if(p.haySF)uHtml=`<span class="dc-done">Sin fecha</span>`;
            else if(p.detD.length>0){
                const id=`d-${emp.num}-${p.anio}`;
                const lst=p.detD.map((d,idx)=>{const{dia,fecha}=fmtDia(d);return`<div class="fi"><span class="fn">${idx+1}.</span><span class="fdia">${dia}</span><span class="fdate">${fecha}</span></div>`;}).join('');
                uHtml=`<button class="ftgl" onclick="tgF('${id}')">\u{1F4C5} ${p.detD.length} fecha${p.detD.length>1?'s':''} \u25be</button><div class="flst" id="${id}">${lst}</div>`;
            }else uHtml=`<span style="color:var(--ink-muted)">\u2014</span>`;
            compRows+=`<tr class="yr ${i%2===0?'sa':'sb'}">
                <td><div class="yn">A\u00f1o ${p.anio}</div><div class="yd">${fmt(p.ap,true)} \u2192 ${fmt(p.ci,true)}</div></td>
                <td class="c">${p.dt}</td>
                <td><div class="uct">${p.us} / ${p.dt}</div><div class="mbar"><div class="mfill f-ok" style="width:100%"></div></div><div class="usub">${uHtml}</div></td>
                <td class="c"><span class="pn n">0</span></td><td></td>
            </tr>`;
        });
        allRows+=`<tr><td colspan="5" style="padding:0">
            <div class="sec-hdr completo" style="cursor:pointer" onclick="tgComp('${compId}')">
                \u2713 Periodos completos <span class="sec-badge">${gCompleto.length} a\u00f1o${gCompleto.length>1?'s':''}</span>
                <span style="margin-left:auto;font-size:.7rem" id="arrtxt-${compId}">\u25bc Ver</span>
            </div>
        </td></tr>
        <tr id="${compId}" style="display:none"><td colspan="5" style="padding:0">
            <table class="yt" style="border-radius:0"><thead><tr><th>Periodo</th><th class="c">D\u00edas</th><th>Usados / Detalle</th><th class="c">Pend.</th><th>Vencimiento</th></tr></thead>
            <tbody>${compRows}</tbody></table>
        </td></tr>`;
    }

    const bodyHTML=`<table class="yt">${thead}<tbody>${allRows}</tbody>
        <tfoot><tr class="trow"><td>TOTAL</td><td class="c">${per.reduce((s,p)=>s+p.dt,0)}</td>
        <td>${per.reduce((s,p)=>s+p.us,0)} usados</td>
        <td class="c">${per.reduce((s,p)=>s+p.pend,0)}</td><td></td></tr></tfoot>
    </table>`;

    // Strip compact single row with two sections + total
    const vdPT=diasPorTomar*emp.sd,prPT=vdPT*.25,totPT=vdPT+prPT;
    const totGlobal=tot+totPT;

    card.innerHTML=`
    <div class="ch" onclick="tgCard(this)">
        <div class="av">${ini(emp.nombre)}</div>
        <div class="cn"><strong>${emp.nombre}</strong><span>#${emp.num} · ${emp.eq||'Sin equipo'} · ${anios} años antigüedad vacacional</span></div>
        <div class="cbdgs">${bdgs}</div>
        <span class="ctg">▼</span>
    </div>
    <div class="cb">
        <div class="estrip">
            <div class="ei ei-sm"><span class="eilbl">Ingreso</span><span class="eival">${fmtFull(emp.fi)}</span></div>
            <div class="ei ei-sm"><span class="eilbl">Antigüedad</span><span class="eival">${anios} años</span></div>
            <div class="ei-sep"></div>
            <div class="ei" style="background:#fff8f0"><span class="eilbl warn-lbl">💰 Días adeudo</span><span class="eival hi">${diasAdeudo}</span></div>
            <div class="ei" style="background:#fff8f0"><span class="eilbl warn-lbl">Valor días</span><span class="eival">${money(vd)}</span></div>
            <div class="ei" style="background:#fff8f0"><span class="eilbl warn-lbl">Prima 25%</span><span class="eival">${money(pr)}</span></div>
            <div class="ei" style="background:#fff8f0"><span class="eilbl warn-lbl">Pasivo real</span><span class="eival hi">${money(tot)}</span></div>
            <div class="ei-sep"></div>
            <div class="ei" style="background:#f0f7ff"><span class="eilbl blue-lbl">📅 Por tomar</span><span class="eival" style="color:var(--blue)">${diasPorTomar}</span></div>
            <div class="ei" style="background:#f0f7ff"><span class="eilbl blue-lbl">Valor (ref.)</span><span class="eival">${money(vdPT)}</span></div>
            <div class="ei" style="background:#f0f7ff"><span class="eilbl blue-lbl">Prima (ref.)</span><span class="eival">${money(prPT)}</span></div>
            <div class="ei" style="background:#f0f7ff"><span class="eilbl blue-lbl">Total ref.</span><span class="eival" style="color:var(--blue)">${money(totPT)}</span></div>
            <div class="ei-sep"></div>
            <div class="ei" style="background:#ede9fd"><span class="eilbl" style="color:var(--accent)">Sal. diario</span><span class="eival">${money(emp.sd)}</span></div>
            <div class="ei" style="background:#ede9fd;border-right:none"><span class="eilbl" style="color:var(--accent)">Σ Total combinado</span><span class="eival hi">${money(totGlobal)}</span></div>
        </div>
        ${bodyHTML}
        <div class="cacts">
            <button class="pbtn pbtn-outline" onclick="printEmp('${emp.nombre.replace(/'/g,"\\'")}',true)">🖨 Compacto</button>
            <button class="pbtn pbtn-dark" onclick="printEmp('${emp.nombre.replace(/'/g,"\\'")}',false)">🖨 Con detalle</button>
        </div>
    </div>`;
    return card;
}



/* ── TOGGLES ── */
function tgF(id){
    const el=document.getElementById(id);if(!el)return;
    const op=el.classList.toggle('open');
    const btn=el.previousElementSibling;
    if(btn&&btn.classList.contains('ftgl'))btn.innerHTML=btn.innerHTML.replace(op?'▾':'▴',op?'▴':'▾');
}
function tgCard(ch){
    const cb=ch.nextElementSibling,tg=ch.querySelector('.ctg');
    cb.classList.toggle('open');tg.classList.toggle('open',cb.classList.contains('open'));
}
function tgComp(id){
    const el=document.getElementById(id);if(!el)return;
    const vis=el.style.display==='none'||el.style.display==='';
    el.style.display=vis?'table-row':'none';
    const arr=document.getElementById('arrtxt-'+id);
    if(arr)arr.textContent=vis?'▴ Ocultar':'▼ Ver';
}

/* ── FILTERS ── */
function setFilter(f,btn){
    curFilter=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');filterCards();
}
function filterCards(){
    const q=document.getElementById('srch').value.toLowerCase();
    document.querySelectorAll('.ecard').forEach(c=>{
        const mn=c.dataset.n.includes(q);
        const mf=curFilter==='todos'?true:
            curFilter==='pendientes'?c.dataset.f!=='ok':
            curFilter==='vencidos'?c.dataset.f==='vencidos':
            curFilter==='proximos'?c.dataset.f==='proximos':
            curFilter==='solicitados'?c.dataset.sol==='1':true;
        c.style.display=mn&&mf?'':'none';
    });
}

/* ══════════════════════════════
   EXECUTIVE REPORT
══════════════════════════════ */
function buildReport(){
    const today=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
    let totAdeudoDias=0,totAdeudoPesos=0,totPorTomar=0;
    let rows='';

    emps.forEach(emp=>{
        const per=calcular(emp);
        if(!per.length)return;

        const gA=per.filter(p=>p.ev==='nv'&&p.pend>0);
        const gP=per.filter(p=>['exp','soon','fut'].includes(p.ev)&&p.pend>0);

        const dA=gA.reduce((s,p)=>s+p.pend,0);
        const vdA=dA*emp.sd,prA=vdA*.25,totA=vdA+prA;

        const dP=gP.reduce((s,p)=>s+p.pend,0);
        const dSol=gP.reduce((s,p)=>s+p.detS.length,0);
        const dPneto=Math.max(0,dP-dSol);

        totAdeudoDias+=dA;
        totAdeudoPesos+=totA;
        totPorTomar+=dPneto;

        // vencimientos
        let vencHTML='';
        gP.forEach(p=>{
            if(p.pend===0)return;
            const neto=Math.max(0,p.pend-p.detS.length);
            if(neto===0)return;
            let chip=p.ev==='exp'?`<span class="vchip vchip-e">⚠ VENCIDO</span>`:
                     p.ev==='soon'?`<span class="vchip vchip-s">⏰ ${p.dpv} días</span>`:
                     `<span class="vchip vchip-f">${fmt(p.venc)}</span>`;
            vencHTML+=`<div style="font-size:.72rem;margin-top:3px">Año ${p.anio}: <strong>${neto} días</strong> ${chip}</div>`;
        });

        const anios=per.length;
        rows+=`<tr>
            <td>
                <div class="rname">${emp.nombre}</div>
                <div class="rsub">#${emp.num} · ${emp.eq||'—'} · ${anios} años ant. vac.</div>
            </td>
            <td style="text-align:center">
                ${dA>0?`<div class="pc-dias">${dA}</div><div class="pc-breakdown">Días × ${money(emp.sd)}<br>Valor: ${money(vdA)}<br>Prima 25%: ${money(prA)}</div><div class="pc-total">${money(totA)}</div>`:`<span style="color:var(--ink-muted);font-size:.8rem">—</span>`}
            </td>
            <td style="text-align:center">
                ${dP>0?`<div class="pt-dias">${dPneto}</div><div class="pt-sub">${dP} pendientes${dSol>0?`<br><span style="color:var(--blue)">${dSol} ya solicitados</span>`:''}</div>`:`<span style="color:var(--ink-muted);font-size:.8rem">—</span>`}
            </td>
            <td>${vencHTML||`<span style="color:var(--ink-muted);font-size:.75rem">Sin vencimientos próximos</span>`}</td>
        </tr>`;
    });

    const totValDias=totAdeudoPesos/1.25,totPrima=totAdeudoPesos-totValDias;

    return `
    <div class="rmeta">Generado el <strong>${today}</strong> &nbsp;·&nbsp; Paz Mental S.A.P.I. de C.V. &nbsp;·&nbsp; <strong>${emps.length}</strong> empleados activos</div>

    <table class="rtbl">
        <thead><tr>
            <th style="width:22%">Empleado</th>
            <th style="width:26%;text-align:center">💰 Adeudo sin vencimiento<br><span style="font-weight:300;font-size:.6rem">Días acumulados · Pasivo monetario real</span></th>
            <th style="width:22%;text-align:center">📅 Días por tomar<br><span style="font-weight:300;font-size:.6rem">Pendientes de tomar (neto)</span></th>
            <th style="width:30%">⏰ Vencimientos<br><span style="font-weight:300;font-size:.6rem">Fechas límite para tomar</span></th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
            <td><strong>TOTALES</strong></td>
            <td style="text-align:center"><strong>${totAdeudoDias} días · ${money(totAdeudoPesos)}</strong></td>
            <td style="text-align:center"><strong>${totPorTomar} días por tomar</strong></td>
            <td></td>
        </tr></tfoot>
    </table>

    <div class="rtots">
        <div class="rto accent"><div class="rto-v">${totAdeudoDias}</div><div class="rto-l">Días adeudados<br>sin vencimiento</div></div>
        <div class="rto"><div class="rto-v">${money(totValDias)}</div><div class="rto-l">Valor de días<br>adeudados</div></div>
        <div class="rto"><div class="rto-v">${money(totPrima)}</div><div class="rto-l">Prima vacacional<br>25%</div></div>
        <div class="rto red-bg"><div class="rto-v">${money(totAdeudoPesos)}</div><div class="rto-l">Total pasivo<br>acumulado</div></div>
        <div class="rto blue-bg"><div class="rto-v">${totPorTomar}</div><div class="rto-l">Días por tomar<br>(con vencimiento)</div></div>
    </div>`;
}

/* ── LOAD ── */
async function loadData(){
    try{
        const[er,vr]=await Promise.all([
            fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Empleados`),
            fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Vacaciones_Tomadas`)
        ]);
        const et=await er.text(),vt=await vr.text();
        const ej=JSON.parse(et.substring(47).slice(0,-2));
        const vj=JSON.parse(vt.substring(47).slice(0,-2));
        emps=ej.table.rows.map(r=>({
            num:String(r.c[0]?.v||''),nombre:r.c[1]?.v||'',
            fi:parseDate(r.c[2]?.v||r.c[2]?.f),
            sd:parseFloat(r.c[3]?.v||0),
            eq:r.c[4]?.v||'',rol:r.c[5]?.v||'Empleado'
        }));
        vacs=vj.table.rows.map(r=>({
            num:String(r.c[0]?.v||''),
            f:parseDate(r.c[1]?.v||r.c[1]?.f),
            anio:parseInt(r.c[2]?.v||0),
            st:r.c[3]?.v||'Disfrutadas'
        }));
        document.getElementById('loadScr').style.display='none';
        document.getElementById('app').style.display='block';
        renderAll();
    }catch(e){
        document.getElementById('loadScr').innerHTML=`<div class="err">❌ Error al cargar. Abre desde GitHub Pages.<br><small>${e.message}</small></div>`;
    }
}
window.onload=loadData;
