<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacaciones · Paz Mental</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1c1c2e;
            --ink-soft: #52526e;
            --ink-muted: #9898b8;
            --bg: #f0eff8;
            --white: #ffffff;
            --accent:      #6c5ce7;
            --accent-light:#ede9fd;
            --ok:          #00836e;
            --ok-light:    #d4f5ef;
            --warn:        #b86200;
            --warn-light:  #fdecd4;
            --danger-text: #a61c1c;
            --danger-bg:   #fde8e8;
            --blue:        #1a6fb5;
            --blue-light:  #dceeff;
            --purple-light:#f0edff;
            --border: #e2e0f0;
            --stripe-a: #f7f6ff;
            --stripe-b: #f2faf8;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); font-size:13.5px; line-height:1.4; }

        /* ── HEADER ── */
        .site-header {
            background:var(--ink); color:#fff;
            padding:11px 28px; display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; z-index:200; box-shadow:0 2px 12px rgba(0,0,0,.3);
        }
        .site-header h1 { font-family:'DM Serif Display',serif; font-size:1.1rem; }
        .site-header small { color:rgba(255,255,255,.4); font-size:.7rem; margin-left:8px; }
        #lastUpdate { font-size:.7rem; color:rgba(255,255,255,.35); }

        /* ── SUMMARY BAR ── */
        .summary-bar {
            background:var(--white); border-bottom:1px solid var(--border);
            padding:9px 28px; display:flex; gap:20px; flex-wrap:wrap; align-items:center;
        }
        .s-pill { display:flex; align-items:center; gap:6px; font-size:.78rem; }
        .s-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .s-pill strong { font-size:.95rem; font-weight:600; }

        /* ── CONTROLS ── */
        .controls { padding:10px 28px; display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
        .search-input {
            padding:6px 12px; border:1.5px solid var(--border); border-radius:7px;
            font-size:.8rem; font-family:'DM Sans',sans-serif;
            background:var(--white); color:var(--ink); width:200px;
        }
        .search-input:focus { outline:none; border-color:var(--accent); }
        .fbtn {
            padding:5px 12px; border:1.5px solid var(--border); border-radius:7px;
            font-size:.75rem; font-family:'DM Sans',sans-serif;
            background:var(--white); color:var(--ink-soft); cursor:pointer; transition:all .15s;
        }
        .fbtn.active,.fbtn:hover { background:var(--ink); color:#fff; border-color:var(--ink); }
        .fbtn-report {
            padding:5px 14px; border:1.5px solid var(--accent); border-radius:7px;
            font-size:.75rem; font-family:'DM Sans',sans-serif;
            background:var(--accent-light); color:var(--accent); cursor:pointer;
            font-weight:600; transition:all .15s; margin-left:8px;
        }
        .fbtn-report:hover { background:var(--accent); color:#fff; }

        /* ── EMPLOYEE LIST ── */
        .emp-list { padding:10px 28px 60px; display:flex; flex-direction:column; gap:8px; }

        /* ── CARD ── */
        .emp-card {
            background:var(--white); border:1px solid var(--border);
            border-radius:9px; overflow:hidden;
            box-shadow:0 1px 5px rgba(28,28,46,.05);
        }
        .emp-card.has-expired { border-left:3px solid var(--danger-text); }
        .emp-card.has-soon    { border-left:3px solid var(--warn); }

        /* ── CARD HEADER ── */
        .ch {
            padding:10px 16px; display:flex; align-items:center; gap:11px;
            cursor:pointer; user-select:none; background:var(--white); transition:background .15s;
        }
        .ch:hover { background:#fafafe; }
        .avatar {
            width:32px; height:32px; border-radius:50%; background:var(--ink); color:#fff;
            display:flex; align-items:center; justify-content:center;
            font-family:'DM Serif Display',serif; font-size:.85rem; flex-shrink:0;
        }
        .ch-name { flex:1; min-width:0; }
        .ch-name strong { font-size:.9rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ch-name span   { font-size:.7rem; color:var(--ink-muted); }
        .ch-badges { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
        .bdg { padding:2px 8px; border-radius:10px; font-size:.7rem; font-weight:500; white-space:nowrap; }
        .bdg-pend    { background:var(--accent-light); color:var(--accent); }
        .bdg-expired { background:var(--danger-bg);    color:var(--danger-text); }
        .bdg-soon    { background:var(--warn-light);   color:var(--warn); }
        .bdg-solicit { background:var(--blue-light);   color:var(--blue); }
        .bdg-ok      { background:var(--ok-light);     color:var(--ok); }
        .ch-toggle { color:var(--ink-muted); font-size:.65rem; transition:transform .25s; flex-shrink:0; }
        .ch-toggle.open { transform:rotate(180deg); }

        /* ── CARD BODY ── */
        .cb { display:none; border-top:1px solid var(--border); }
        .cb.open { display:block; }

        /* ── EMP STRIP ── */
        .emp-strip {
            display:flex; flex-wrap:wrap; background:var(--purple-light);
            border-bottom:1px solid var(--border);
        }
        .es-item { padding:7px 14px; border-right:1px solid var(--border); flex:1; min-width:110px; }
        .es-item:last-child { border-right:none; }
        .es-label { font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-muted); display:block; margin-bottom:1px; }
        .es-val   { font-size:.85rem; font-weight:600; }
        .es-val.hi { color:var(--accent); }

        /* ── YEAR TABLE ── */
        .yt { width:100%; border-collapse:collapse; }
        .yt thead tr { background:var(--ink); color:#fff; }
        .yt thead th { padding:6px 11px; font-size:.65rem; text-transform:uppercase; letter-spacing:.07em; font-weight:500; text-align:left; }
        .yt thead th.c { text-align:center; }
        .yr-row { border-bottom:1px solid var(--border); }
        .yr-row:last-child { border-bottom:none; }
        .yr-row.sa   { background:var(--stripe-a); }
        .yr-row.sb   { background:var(--stripe-b); }
        .yr-row.rexp { background:#fff3f3; }
        .yr-row.rsoon{ background:#fffbf2; }
        .yt td { padding:7px 11px; vertical-align:middle; }
        .yt td.c { text-align:center; }
        .yr-num   { font-weight:700; font-size:.88rem; }
        .yr-dates { font-size:.67rem; color:var(--ink-muted); margin-top:1px; }

        .mini-bar { height:4px; background:var(--border); border-radius:3px; overflow:hidden; width:70px; margin-top:3px; }
        .mini-fill { height:100%; border-radius:3px; }
        .f-ok   { background:var(--ok); }
        .f-part { background:var(--accent); }

        .used-ct  { font-size:.8rem; font-weight:600; }
        .used-sub { font-size:.67rem; color:var(--ink-muted); margin-top:2px; }

        /* ── FECHA LISTS ── */
        .fechas-toggle {
            display:inline-flex; align-items:center; gap:4px;
            font-size:.7rem; color:var(--blue); cursor:pointer; margin-top:3px;
            background:var(--blue-light); padding:2px 8px; border-radius:8px;
            border:none; font-family:'DM Sans',sans-serif; user-select:none;
        }
        .fechas-toggle:hover { opacity:.8; }
        .fechas-lista { display:none; margin-top:5px; border-left:2px solid var(--border); padding-left:8px; }
        .fechas-lista.open { display:block; }
        .fecha-item {
            font-size:.72rem; padding:2px 0; color:var(--ink-soft);
            border-bottom:1px solid #f0eef8; display:flex; gap:6px;
        }
        .fecha-item:last-child { border-bottom:none; }
        .fecha-num  { font-weight:600; color:var(--ink); min-width:14px; text-align:right; }
        .fecha-dia  { color:var(--ink-muted); min-width:55px; }
        .fecha-date { color:var(--ink); }
        .fecha-item.sol .fecha-dia  { color:#6da8e0; }
        .fecha-item.sol .fecha-date { color:var(--blue); }

        .dc-done { display:inline-block; background:var(--ok-light); color:var(--ok); padding:1px 7px; border-radius:8px; font-size:.68rem; font-weight:500; }
        .pn { font-size:.9rem; font-weight:700; }
        .pn.y { color:var(--accent); }
        .pn.n { color:var(--ok); }

        /* ── VENCIMIENTO CHIPS ── */
        .vc { display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:10px; font-size:.68rem; font-weight:500; line-height:1.3; }
        .vc-completo { background:var(--ok-light);   color:var(--ok); }
        .vc-nv       { background:#f0f0f8;            color:var(--ink-soft); }
        .vc-exp      { background:var(--danger-bg);   color:var(--danger-text); font-weight:700; }
        .vc-soon     { background:var(--warn-light);  color:var(--warn); font-weight:700; }
        .vc-future   { background:#f0f0f8;            color:var(--ink-soft); }

        /* ── SOLICITADOS ROW ── */
        .sol-row td { background:#f0f7ff; border-top:1px dashed #b8d4f0; font-size:.75rem; color:var(--blue); padding:5px 11px; }

        /* ── TOTALS ── */
        .tot-row td { background:var(--ink); color:#fff; font-weight:600; font-size:.8rem; padding:7px 11px; }
        .tot-row td.c { text-align:center; }

        /* ── PRINT BUTTONS ── */
        .card-actions { display:flex; gap:8px; margin:8px 14px 10px; flex-wrap:wrap; }
        .print-btn {
            display:inline-flex; align-items:center; gap:4px;
            padding:6px 13px; background:var(--ink); color:#fff;
            border:none; border-radius:7px; font-size:.75rem;
            font-family:'DM Sans',sans-serif; cursor:pointer;
        }
        .print-btn:hover { opacity:.82; }

        /* ── LOADING / ERROR ── */
        #loadingScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:60vh; gap:14px; color:var(--ink-soft); }
        .spinner { width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .err { margin:28px; padding:14px 18px; background:var(--danger-bg); color:var(--danger-text); border-radius:8px; font-size:.85rem; }

        /* ════════════════════════════════
           PRINT STYLES
        ════════════════════════════════ */
        @media print {
            body { background:white; font-size:10px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

            /* hide UI chrome */
            .site-header, .summary-bar, .controls,
            .card-actions, .ch-toggle, .fechas-toggle { display:none !important; }

            /* --- DETAIL PRINT (individual employee) --- */
            .emp-list { padding:0; gap:0; }
            .emp-card { display:none !important; box-shadow:none; border:1px solid #ccc !important; border-radius:0; margin-bottom:0; page-break-after:always; }
            .emp-card.printing { display:block !important; }
            .cb { display:block !important; }
            /* expand all fecha lists when printing */
            .fechas-lista { display:block !important; }
            .ch { cursor:default; background:#f5f4f0 !important; }
            .yr-row.sa { background:#f7f6ff !important; }
            .yr-row.sb { background:#f2faf8 !important; }
            .yr-row.rexp { background:#fff3f3 !important; }
            .emp-strip { background:#ede9fd !important; }
            .yt thead tr { background:#1c1c2e !important; }
            .tot-row td  { background:#1c1c2e !important; }

            /* --- RESUMEN PRINT --- */
            #reportModal { display:none !important; }
            #reportPrintArea { display:block !important; }
            .emp-card, .emp-list { display:none !important; }
        }

        /* ── REPORT MODAL ── */
        #reportModal {
            display:none; position:fixed; inset:0; z-index:500;
            background:rgba(0,0,0,.55); align-items:center; justify-content:center;
        }
        #reportModal.open { display:flex; }
        .modal-box {
            background:var(--white); border-radius:12px; width:min(820px,95vw);
            max-height:90vh; overflow-y:auto;
            box-shadow:0 20px 60px rgba(0,0,0,.3);
        }
        .modal-header {
            background:var(--ink); color:#fff; padding:14px 20px;
            display:flex; align-items:center; justify-content:space-between;
            border-radius:12px 12px 0 0;
            position:sticky; top:0; z-index:10;
        }
        .modal-header h2 { font-family:'DM Serif Display',serif; font-size:1.1rem; }
        .modal-close {
            background:rgba(255,255,255,.15); border:none; color:#fff;
            border-radius:6px; padding:4px 10px; cursor:pointer; font-size:.8rem;
        }
        .modal-actions { padding:12px 20px; display:flex; gap:8px; border-bottom:1px solid var(--border); }

        /* ── REPORT TABLE ── */
        .report-wrap { padding:16px 20px 24px; }
        .report-meta { font-size:.75rem; color:var(--ink-muted); margin-bottom:14px; }
        .report-meta strong { color:var(--ink); }

        .rt { width:100%; border-collapse:collapse; font-size:.78rem; }
        .rt thead tr { background:var(--ink); color:#fff; }
        .rt thead th { padding:7px 10px; text-align:left; font-size:.65rem; text-transform:uppercase; letter-spacing:.06em; font-weight:500; }
        .rt thead th.r { text-align:right; }
        .rt tbody tr { border-bottom:1px solid var(--border); }
        .rt tbody tr:nth-child(even) { background:#faf9ff; }
        .rt tbody tr:last-child { border-bottom:none; }
        .rt td { padding:7px 10px; vertical-align:top; }
        .rt td.r { text-align:right; }
        .rt td.bold { font-weight:600; }

        .rt-name { font-weight:600; font-size:.82rem; }
        .rt-sub  { font-size:.68rem; color:var(--ink-muted); margin-top:1px; }

        .rt-section {
            font-size:.68rem; font-weight:600; text-transform:uppercase;
            letter-spacing:.07em; padding:3px 0; border-bottom:1px solid var(--border);
            color:var(--ink-soft); margin-bottom:4px;
        }

        .rt-block { padding:3px 0; }
        .rt-block-label { font-size:.68rem; color:var(--ink-muted); }
        .rt-block-val   { font-weight:600; }
        .rt-money       { color:var(--accent); }

        .rt-venc-chip {
            display:inline-block; padding:1px 7px; border-radius:8px;
            font-size:.65rem; font-weight:500;
        }
        .rt-venc-exp  { background:var(--danger-bg); color:var(--danger-text); }
        .rt-venc-soon { background:var(--warn-light); color:var(--warn); }
        .rt-venc-fut  { background:#f0f0f8; color:var(--ink-soft); }

        .rt tfoot tr { background:#1c1c2e; color:#fff; }
        .rt tfoot td { padding:8px 10px; font-weight:600; font-size:.8rem; }
        .rt tfoot td.r { text-align:right; }

        /* report totals box */
        .report-totals {
            margin-top:16px; background:var(--purple-light);
            border:1px solid var(--border); border-radius:8px;
            padding:12px 16px; display:flex; gap:24px; flex-wrap:wrap;
        }
        .rto { text-align:center; flex:1; min-width:120px; }
        .rto-val   { font-size:1.2rem; font-weight:700; color:var(--accent); }
        .rto-label { font-size:.68rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

        @media (max-width:600px) {
            .site-header,.summary-bar,.controls,.emp-list { padding-left:12px; padding-right:12px; }
            .yt thead th:nth-child(2),.yt td:nth-child(2) { display:none; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div>
        <h1>🏖 Control de Vacaciones</h1>
        <small>Paz Mental S.A.P.I. de C.V.</small>
    </div>
    <div id="lastUpdate"></div>
</header>

<div id="loadingScreen">
    <div class="spinner"></div>
    <p>Cargando datos…</p>
</div>

<div id="appContent" style="display:none">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="controls">
        <input class="search-input" id="searchInput" placeholder="🔍 Buscar empleado…" oninput="filterCards()">
        <button class="fbtn active" onclick="setFilter('todos',this)">Todos</button>
        <button class="fbtn" onclick="setFilter('pendientes',this)">Con pendientes</button>
        <button class="fbtn" onclick="setFilter('vencidos',this)">⚠ Vencidos</button>
        <button class="fbtn" onclick="setFilter('proximos',this)">⏰ Próximos 30d</button>
        <button class="fbtn" onclick="setFilter('solicitados',this)">📋 Solicitados</button>
        <button class="fbtn-report" onclick="openReport()">📊 Reporte para Dirección</button>
    </div>
    <div class="emp-list" id="empList"></div>
</div>

<!-- REPORT MODAL -->
<div id="reportModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>📊 Reporte de Vacaciones · Paz Mental S.A.P.I. de C.V.</h2>
            <button class="modal-close" onclick="closeReport()">✕ Cerrar</button>
        </div>
        <div class="modal-actions">
            <button class="print-btn" onclick="printReport()">🖨 Imprimir / PDF</button>
        </div>
        <div class="report-wrap" id="reportContent"></div>
    </div>
</div>

<!-- Hidden print area for report -->
<div id="reportPrintArea" style="display:none"></div>

<script>
const SHEET_ID = '1LspktCHoVlK4QDGY6-gB162B5Y2BBJxS6IlCBPiClv8';
let empleados=[], vacaciones=[], currentFilter='todos';

const tablaVieja={1:6,2:8,3:10,4:12,5:14,6:14,7:14,8:14,9:14,10:16,11:16,12:16,13:16,14:16,15:18};
const tablaNueva={1:12,2:14,3:16,4:18,5:20,6:22,7:22,8:22,9:22,10:22,11:24,12:24,13:24,14:24,15:24};
const corte2023=new Date(2023,0,1);

/* ── HELPERS ── */
function parseDate(v){
    if(!v) return null;
    const s=v.toString();
    const m=s.match(/Date\((\d+),(\d+),(\d+)\)/);
    if(m) return new Date(+m[1],+m[2],+m[3]);
    if(s.includes('-')){
        const p=s.split('-');
        if(p.length===3){let[d,mo,y]=p.map(Number);if(y<100)y+=2000;return new Date(y,mo-1,d);}
    }
    const dt=new Date(v); return isNaN(dt)?null:dt;
}
function fmt(d,short){
    if(!d) return '—';
    return d.toLocaleDateString('es-MX',short
        ?{day:'2-digit',month:'short',year:'2-digit'}
        :{day:'2-digit',month:'short',year:'numeric'});
}
function fmtFull(d){ return d?d.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'}):'—'; }
function fmtDia(d){
    if(!d) return {dia:'—',fecha:'—'};
    return {
        dia: d.toLocaleDateString('es-MX',{weekday:'short'}),
        fecha: d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})
    };
}
function initials(n){ return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function money(n){ return '$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function getDias(ing,anio){
    const ap=new Date(ing); ap.setFullYear(ing.getFullYear()+anio);
    const t=ap<corte2023?tablaVieja:tablaNueva;
    return t[Math.min(anio,15)]||(ap<corte2023?18:24);
}

/* ── CORE CALCULATION ── */
function calcular(emp){
    const hoy=new Date(), ing=emp.fechaIngreso;
    if(!ing) return [];
    let abiertos=0;
    for(let a=1;a<=50;a++){
        const ap=new Date(ing); ap.setFullYear(ing.getFullYear()+a);
        if(ap<=hoy) abiertos=a; else break;
    }
    const res=[];
    for(let anio=1;anio<=abiertos;anio++){
        const apertura=new Date(ing); apertura.setFullYear(ing.getFullYear()+anio);
        const cierre=new Date(ing);   cierre.setFullYear(ing.getFullYear()+anio+1); cierre.setDate(cierre.getDate()-1);
        const diasTocan=getDias(ing,anio);
        const vacsAnio=vacaciones.filter(v=>v.num===emp.numero&&v.anio===anio);

        const hayPagadas  =vacsAnio.some(v=>v.status==='Pagadas');
        const haySinFecha =vacsAnio.some(v=>v.status==='Disfrutadas sin fecha');

        let diasPag=0,diasSF=0,diasDis=0;
        const detsDis=[], detsSol=[];

        if(hayPagadas){ diasPag=diasTocan; }
        else if(haySinFecha){ diasSF=diasTocan; }
        else {
            vacsAnio.forEach(v=>{
                if(v.status==='Por disfrutar'&&v.fecha) detsSol.push(v.fecha);
                else if(v.fecha){ diasDis++; detsDis.push(v.fecha); }
            });
        }

        const usados=diasDis+diasPag+diasSF;
        const pendientes=Math.max(0,diasTocan-usados);

        // vencimiento: solo periodos abiertos desde 2025
        let vencimiento=null, diasParaVencer=null, estadoVenc='completo';
        if(pendientes>0){
            if(apertura.getFullYear()>=2025){
                vencimiento=cierre;
                diasParaVencer=Math.ceil((cierre-new Date())/86400000);
                estadoVenc=diasParaVencer<0?'expired':diasParaVencer<=30?'soon':'future';
            } else {
                estadoVenc='no-vence';
            }
        }

        res.push({anio,apertura,cierre,diasTocan,diasDis,diasPag,diasSF,
            usados,pendientes,detsDis,detsSol,
            hayPagadas,haySinFecha,
            vencimiento,diasParaVencer,estadoVenc});
    }
    return res;
}

/* ── RENDER ALL ── */
function renderAll(){
    const list=document.getElementById('empList');
    list.innerHTML='';
    let totPend=0,totVenc=0,totSoon=0,totOk=0,totSol=0;

    empleados.forEach(emp=>{
        const per=calcular(emp);
        const pend=per.reduce((s,p)=>s+p.pendientes,0);
        const tieneVenc=per.some(p=>p.estadoVenc==='expired'&&p.pendientes>0);
        const tieneSoon=per.some(p=>p.estadoVenc==='soon'&&p.pendientes>0);
        const tieneSol =per.some(p=>p.detsSol.length>0);
        if(pend>0)    totPend++;
        if(tieneVenc) totVenc++;
        if(tieneSoon) totSoon++;
        if(pend===0)  totOk++;
        if(tieneSol)  totSol++;
        list.appendChild(buildCard(emp,per,pend,tieneVenc,tieneSoon,tieneSol));
    });

    document.getElementById('summaryBar').innerHTML=`
        <div class="s-pill"><div class="s-dot" style="background:var(--ink)"></div><span><strong>${empleados.length}</strong> empleados</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--accent)"></div><span><strong>${totPend}</strong> con pendientes</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--danger-text)"></div><span><strong>${totVenc}</strong> vencidos</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--warn)"></div><span><strong>${totSoon}</strong> vencen pronto</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--blue)"></div><span><strong>${totSol}</strong> con solicitados</span></div>
        <div class="s-pill"><div class="s-dot" style="background:var(--ok)"></div><span><strong>${totOk}</strong> al corriente</span></div>
    `;
    document.getElementById('lastUpdate').textContent='Actualizado: '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}

/* ── BUILD EMPLOYEE CARD ── */
function buildCard(emp,per,pend,tieneVenc,tieneSoon,tieneSol){
    const card=document.createElement('div');
    card.className='emp-card'+(tieneVenc?' has-expired':tieneSoon?' has-soon':'');
    card.dataset.nombre=emp.nombre.toLowerCase();
    card.dataset.filter=tieneVenc?'vencidos':tieneSoon?'proximos':pend>0?'pendientes':'ok';
    card.dataset.sol=tieneSol?'1':'0';

    const anios=per.length;
    const vd=pend*emp.salarioDiario, pr=vd*.25, tot=vd+pr;

    let bdgs='';
    if(pend>0)    bdgs+=`<span class="bdg bdg-pend">${pend} pend.</span>`;
    if(tieneVenc) bdgs+=`<span class="bdg bdg-expired">⚠ Vencidos</span>`;
    else if(tieneSoon) bdgs+=`<span class="bdg bdg-soon">⏰ Pronto</span>`;
    if(tieneSol)  bdgs+=`<span class="bdg bdg-solicit">📋 Solicitados</span>`;
    if(pend===0&&!tieneSol) bdgs+=`<span class="bdg bdg-ok">✓ Al corriente</span>`;

    let rows='', totD=0,totU=0,totP=0;
    per.forEach((p,i)=>{
        totD+=p.diasTocan; totU+=p.usados; totP+=p.pendientes;
        const pct=p.diasTocan>0?Math.round(p.usados/p.diasTocan*100):100;
        const fillCls=pct>=100?'f-ok':'f-part';
        const rowCls=p.estadoVenc==='expired'&&p.pendientes>0?'rexp':
                     p.estadoVenc==='soon'&&p.pendientes>0?'rsoon':
                     i%2===0?'sa':'sb';

        // usados html
        let usadoHtml='';
        if(p.hayPagadas)       usadoHtml=`<span class="dc-done">Todos pagados</span>`;
        else if(p.haySinFecha)  usadoHtml=`<span class="dc-done">Sin fecha registrada</span>`;
        else if(p.detsDis.length>0){
            const id=`dis-${emp.numero}-${p.anio}`;
            const lista=p.detsDis.map((d,idx)=>{
                const{dia,fecha}=fmtDia(d);
                return `<div class="fecha-item"><span class="fecha-num">${idx+1}.</span><span class="fecha-dia">${dia}</span><span class="fecha-date">${fecha}</span></div>`;
            }).join('');
            usadoHtml=`<button class="fechas-toggle" onclick="toggleFechas('${id}')">📅 Ver ${p.detsDis.length} fecha${p.detsDis.length>1?'s':''} ▾</button><div class="fechas-lista" id="${id}">${lista}</div>`;
        } else usadoHtml=`<span style="color:var(--ink-muted)">—</span>`;

        // vencimiento chip — sin "Listo", solo vacío cuando está completo
        let vChip='';
        if(p.pendientes===0)               vChip=``;
        else if(p.estadoVenc==='no-vence') vChip=`<span class="vc vc-nv">Sin vencimiento</span>`;
        else if(p.estadoVenc==='expired')  vChip=`<span class="vc vc-exp">⚠ Venció ${fmt(p.vencimiento)}</span>`;
        else if(p.estadoVenc==='soon')     vChip=`<span class="vc vc-soon">⏰ ${p.diasParaVencer}d · ${fmt(p.vencimiento)}</span>`;
        else                               vChip=`<span class="vc vc-future">${fmt(p.vencimiento)}</span>`;

        rows+=`
        <tr class="yr-row ${rowCls}">
            <td><div class="yr-num">Año ${p.anio}</div><div class="yr-dates">${fmt(p.apertura,true)} → ${fmt(p.cierre,true)}</div></td>
            <td class="c" style="font-weight:600">${p.diasTocan}</td>
            <td>
                <div class="used-ct">${p.usados} / ${p.diasTocan}</div>
                <div class="mini-bar"><div class="mini-fill ${fillCls}" style="width:${pct}%"></div></div>
                <div class="used-sub">${usadoHtml}</div>
            </td>
            <td class="c"><span class="pn ${p.pendientes>0?'y':'n'}">${p.pendientes}</span></td>
            <td>${vChip}</td>
        </tr>`;

        // solicitados sub-row
        if(p.detsSol.length>0){
            const solId=`sol-${emp.numero}-${p.anio}`;
            const solLista=p.detsSol.map((d,idx)=>{
                const{dia,fecha}=fmtDia(d);
                return `<div class="fecha-item sol"><span class="fecha-num">${idx+1}.</span><span class="fecha-dia">${dia}</span><span class="fecha-date">${fecha}</span></div>`;
            }).join('');
            rows+=`
            <tr class="sol-row">
                <td colspan="5">
                    📋 <strong>${p.detsSol.length} día${p.detsSol.length>1?'s':''} ya solicitados, pendientes de tomar</strong>
                    <button class="fechas-toggle" style="margin-left:8px" onclick="toggleFechas('${solId}')">Ver fechas ▾</button>
                    <div class="fechas-lista" id="${solId}">${solLista}</div>
                </td>
            </tr>`;
        }
    });

    card.innerHTML=`
    <div class="ch" onclick="toggleCard(this)">
        <div class="avatar">${initials(emp.nombre)}</div>
        <div class="ch-name">
            <strong>${emp.nombre}</strong>
            <span>#${emp.numero} · ${emp.equipo||'Sin equipo'} · Año ${anios}</span>
        </div>
        <div class="ch-badges">${bdgs}</div>
        <span class="ch-toggle">▼</span>
    </div>
    <div class="cb">
        <div class="emp-strip">
            <div class="es-item"><span class="es-label">Ingreso</span><span class="es-val">${fmtFull(emp.fechaIngreso)}</span></div>
            <div class="es-item"><span class="es-label">Antigüedad</span><span class="es-val">Año ${anios}</span></div>
            <div class="es-item"><span class="es-label">Días pendientes</span><span class="es-val hi">${pend}</span></div>
            <div class="es-item"><span class="es-label">Salario diario</span><span class="es-val">${money(emp.salarioDiario)}</span></div>
            <div class="es-item"><span class="es-label">Valor días</span><span class="es-val">${money(vd)}</span></div>
            <div class="es-item"><span class="es-label">Prima 25%</span><span class="es-val">${money(pr)}</span></div>
            <div class="es-item"><span class="es-label">Total pasivo</span><span class="es-val hi">${money(tot)}</span></div>
        </div>
        <table class="yt">
            <thead><tr>
                <th>Periodo</th><th class="c">Días</th>
                <th>Usados / Detalle</th>
                <th class="c">Pend.</th><th>Vencimiento</th>
            </tr></thead>
            <tbody>${rows}</tbody>
            <tfoot><tr class="tot-row">
                <td>TOTAL</td><td class="c">${totD}</td>
                <td>${totU} usados</td><td class="c">${totP}</td><td></td>
            </tr></tfoot>
        </table>
        <div class="card-actions">
            <button class="print-btn" onclick="printEmp('${emp.nombre.replace(/'/g,"\\'")}')">🖨 Imprimir detalle</button>
        </div>
    </div>`;

    return card;
}

/* ── TOGGLE FUNCTIONS ── */
function toggleFechas(id){
    const el=document.getElementById(id); if(!el) return;
    const open=el.classList.toggle('open');
    const btn=el.previousElementSibling;
    if(btn&&btn.classList.contains('fechas-toggle'))
        btn.innerHTML=btn.innerHTML.replace(open?'▾':'▴', open?'▴':'▾');
}
function toggleCard(ch){
    const cb=ch.nextElementSibling, tg=ch.querySelector('.ch-toggle');
    cb.classList.toggle('open'); tg.classList.toggle('open',cb.classList.contains('open'));
}

/* ── FILTERS ── */
function setFilter(f,btn){
    currentFilter=f;
    document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); filterCards();
}
function filterCards(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.emp-card').forEach(c=>{
        const mn=c.dataset.nombre.includes(q);
        const mf=currentFilter==='todos'?true:
            currentFilter==='pendientes'?c.dataset.filter!=='ok':
            currentFilter==='vencidos'  ?c.dataset.filter==='vencidos':
            currentFilter==='proximos'  ?c.dataset.filter==='proximos':
            currentFilter==='solicitados'?c.dataset.sol==='1':true;
        c.style.display=mn&&mf?'':'none';
    });
}

/* ── PRINT INDIVIDUAL EMPLOYEE ── */
function printEmp(nombre){
    // open all accordions & fecha lists for this card
    document.querySelectorAll('.emp-card').forEach(c=>c.classList.remove('printing'));
    const target=[...document.querySelectorAll('.emp-card')]
        .find(c=>c.dataset.nombre===nombre.toLowerCase());
    if(target){
        target.classList.add('printing');
        target.querySelector('.cb').classList.add('open');
        // open all fecha lists automatically
        target.querySelectorAll('.fechas-lista').forEach(fl=>fl.classList.add('open'));
    }
    window.print();
    setTimeout(()=>{
        document.querySelectorAll('.emp-card').forEach(c=>c.classList.remove('printing'));
    },1200);
}

/* ══════════════════════════════════════
   EXECUTIVE REPORT
══════════════════════════════════════ */
function buildReportHTML(){
    const today=new Date();
    const todayStr=today.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});

    let totalPasivoDinero=0, totalDiasConVenc=0, totalDiasSinVenc=0;
    let rows='';

    empleados.forEach(emp=>{
        const per=calcular(emp);
        if(!per.length) return;

        // Días SIN vencimiento = abiertos antes de 2025 con pendientes
        const periodosSinVenc=per.filter(p=>p.estadoVenc==='no-vence'&&p.pendientes>0);
        const diasSinVenc=periodosSinVenc.reduce((s,p)=>s+p.pendientes,0);

        // Días CON vencimiento = abiertos desde 2025
        const periodosConVenc=per.filter(p=>
            (p.estadoVenc==='expired'||p.estadoVenc==='soon'||p.estadoVenc==='future')&&p.pendientes>0
        );
        const diasConVencBruto=periodosConVenc.reduce((s,p)=>s+p.pendientes,0);
        // Días ya solicitados (por disfrutar) dentro de periodos con vencimiento
        const diasSolicitados=periodosConVenc.reduce((s,p)=>s+p.detsSol.length,0);
        const diasConVencNeto=Math.max(0,diasConVencBruto-diasSolicitados);

        // Pasivo monetario = solo días sin vencimiento (adeudo real acumulado)
        const valorSinVenc=diasSinVenc*emp.salarioDiario;
        const primaSinVenc=valorSinVenc*0.25;
        const totalSinVenc=valorSinVenc+primaSinVenc;

        totalPasivoDinero+=totalSinVenc;
        totalDiasConVenc+=diasConVencNeto;
        totalDiasSinVenc+=diasSinVenc;

        const anios=per.length;

        // Upcoming vencimientos relevantes
        let vencInfo='';
        periodosConVenc.forEach(p=>{
            if(p.pendientes>0&&p.vencimiento){
                const neto=Math.max(0,p.pendientes-p.detsSol.length);
                if(neto===0) return;
                let chip='';
                if(p.estadoVenc==='expired') chip=`<span class="rt-venc-chip rt-venc-exp">⚠ Vencido</span>`;
                else if(p.estadoVenc==='soon') chip=`<span class="rt-venc-chip rt-venc-soon">⏰ ${p.diasParaVencer}d</span>`;
                else chip=`<span class="rt-venc-chip rt-venc-fut">${fmt(p.vencimiento)}</span>`;
                vencInfo+=`<div style="margin-top:3px;font-size:.7rem">Año ${p.anio}: <strong>${neto}</strong> días pendientes ${chip}</div>`;
            }
        });
        if(!vencInfo) vencInfo=`<span style="color:var(--ink-muted);font-size:.7rem">—</span>`;

        rows+=`
        <tr>
            <td>
                <div class="rt-name">${emp.nombre}</div>
                <div class="rt-sub">#${emp.numero} · ${emp.equipo||'—'} · Año ${anios}</div>
            </td>
            <td class="r">
                ${diasSinVenc>0
                    ? `<strong>${diasSinVenc}</strong><div style="font-size:.68rem;color:var(--ink-muted)">${money(valorSinVenc)}<br>PV ${money(primaSinVenc)}</div>`
                    : `<span style="color:var(--ink-muted)">0</span>`}
            </td>
            <td class="r bold rt-money">${diasSinVenc>0?money(totalSinVenc):'—'}</td>
            <td>
                ${diasConVencBruto>0
                    ? `<strong>${diasConVencBruto}</strong> días${diasSolicitados>0?` <span style="color:var(--blue);font-size:.7rem">(${diasSolicitados} solicitados)</span>`:''}<br><strong style="color:var(--accent)">${diasConVencNeto} por tomar</strong>`
                    : `<span style="color:var(--ink-muted)">—</span>`}
            </td>
            <td>${vencInfo}</td>
        </tr>`;
    });

    const primaTotal=totalPasivoDinero/1.25*0.25;
    const valorDiasTotal=totalPasivoDinero-primaTotal;

    return `
    <div class="report-meta">
        Generado el <strong>${todayStr}</strong> &nbsp;·&nbsp;
        Paz Mental S.A.P.I. de C.V. &nbsp;·&nbsp;
        <strong>${empleados.length}</strong> empleados activos
    </div>

    <table class="rt">
        <thead><tr>
            <th>Empleado</th>
            <th class="r" style="width:140px">Días sin vencimiento<br><span style="font-weight:300;font-size:.6rem">(adeudo acumulado)</span></th>
            <th class="r" style="width:110px">Total pasivo<br><span style="font-weight:300;font-size:.6rem">(días + PV 25%)</span></th>
            <th style="width:160px">Días con vencimiento<br><span style="font-weight:300;font-size:.6rem">(pendientes de tomar)</span></th>
            <th style="width:180px">Vencimientos próximos</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
            <td><strong>TOTALES</strong></td>
            <td class="r"><strong>${totalDiasSinVenc} días</strong></td>
            <td class="r"><strong>${money(totalPasivoDinero)}</strong></td>
            <td><strong>${totalDiasConVenc} días por tomar</strong></td>
            <td></td>
        </tr></tfoot>
    </table>

    <div class="report-totals">
        <div class="rto"><div class="rto-val">${totalDiasSinVenc}</div><div class="rto-label">Días sin vencimiento<br>(adeudo acumulado)</div></div>
        <div class="rto"><div class="rto-val">${money(valorDiasTotal)}</div><div class="rto-label">Valor días adeudados</div></div>
        <div class="rto"><div class="rto-val">${money(primaTotal)}</div><div class="rto-label">Prima vacacional 25%</div></div>
        <div class="rto"><div class="rto-val" style="color:var(--danger-text)">${money(totalPasivoDinero)}</div><div class="rto-label">TOTAL PASIVO</div></div>
        <div class="rto"><div class="rto-val" style="color:var(--blue)">${totalDiasConVenc}</div><div class="rto-label">Días con venc.<br>pendientes de tomar</div></div>
    </div>`;
}

function openReport(){
    document.getElementById('reportContent').innerHTML=buildReportHTML();
    document.getElementById('reportModal').classList.add('open');
}
function closeReport(){
    document.getElementById('reportModal').classList.remove('open');
}

function printReport(){
    const content=document.getElementById('reportContent').innerHTML;
    const area=document.getElementById('reportPrintArea');
    area.innerHTML=`
        <div style="padding:20px;font-family:'DM Sans',sans-serif;font-size:11px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;border-bottom:2px solid #1c1c2e;padding-bottom:10px;">
                <div>
                    <div style="font-family:'DM Serif Display',serif;font-size:1.3rem;color:#1c1c2e">📊 Reporte de Vacaciones</div>
                    <div style="font-size:.8rem;color:#52526e">Paz Mental S.A.P.I. de C.V.</div>
                </div>
                <div style="font-size:.75rem;color:#9898b8">${new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'})}</div>
            </div>
            ${content}
        </div>`;
    area.style.display='block';
    // hide everything else
    document.getElementById('appContent').style.display='none';
    document.getElementById('reportModal').classList.remove('open');
    window.print();
    setTimeout(()=>{
        area.style.display='none';
        area.innerHTML='';
        document.getElementById('appContent').style.display='block';
    },1500);
}

/* ── LOAD DATA ── */
async function loadData(){
    try{
        const[er,vr]=await Promise.all([
            fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Empleados`),
            fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Vacaciones_Tomadas`)
        ]);
        const et=await er.text(), vt=await vr.text();
        const ej=JSON.parse(et.substring(47).slice(0,-2));
        const vj=JSON.parse(vt.substring(47).slice(0,-2));

        empleados=ej.table.rows.map(r=>({
            numero:String(r.c[0]?.v||''),
            nombre:r.c[1]?.v||'',
            fechaIngreso:parseDate(r.c[2]?.v||r.c[2]?.f),
            salarioDiario:parseFloat(r.c[3]?.v||0),
            equipo:r.c[4]?.v||'',
            rol:r.c[5]?.v||'Empleado'
        }));
        vacaciones=vj.table.rows.map(r=>({
            num:String(r.c[0]?.v||''),
            fecha:parseDate(r.c[1]?.v||r.c[1]?.f),
            anio:parseInt(r.c[2]?.v||0),
            status:r.c[3]?.v||'Disfrutadas'
        }));

        document.getElementById('loadingScreen').style.display='none';
        document.getElementById('appContent').style.display='block';
        renderAll();
    } catch(e){
        document.getElementById('loadingScreen').innerHTML=
            `<div class="err">❌ Error al cargar. Abre desde GitHub Pages, no local.<br><small>${e.message}</small></div>`;
    }
}
window.onload=loadData;
</script>
